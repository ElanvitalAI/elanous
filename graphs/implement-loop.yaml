# ⭐ 지금 «실제로 도는» 파이프라인 — 출처는 외부 예시가 아니라 우리 아나토미다.
#   📄 내부 문서 `TECH-harness-execution-anatomy-current-state-2026-08-10` §8a (노드 × 모듈 × 액션 표)
#   📏 값의 출처(⛔ 지어낸 것 없음):
#      terminal_stages ← src/self-implement/pipeline-shape.ts  TERMINAL_STAGES_BY_NODE
#      progress        ← src/self-implement/orchestrator.ts    progress('…')
#      recipe          ← 아나토미 §8a 「모듈(어디서)」 칸
#      edges           ← pipeline-shape.ts  PIPELINE_EDGES_BY_NODE
#
# ⛔⭐ 이 파일이 코드 상수와 «어긋나면» 시험이 빨갛다(graph-yaml.test.ts).
#   승격이 끝나 그 상수가 은퇴하면 이 파일이 «유일한» 출처가 된다.

# ⏳⛔⭐⭐ **`observed:` 는 «늙는다» — 다만 「반증 불가」는 아니다** (🅢 실측 2026-09-14 · ⛔ 같은 날 «정정»)
#   🩸 이 자리에 처음 적었던 *"원장 보유 창 6일 ⇒ 09-08 자는 반증 불가"* 는 ***틀렸다.*** 아래가 다시 잰 값이다.
#   📏 `graphId` 가 붙은 «가장 이른» 행 = ***2026-09-07T22:40:56Z***
#      그 계측을 넣은 `#16073` 병합 = ***2026-09-07T22:32:34Z***   ⇒ ***8분 22초 뒤***
#      ⇒ 🔑 그 바닥은 ***「시대」(계측이 그때 들어왔다)***이지 «보존 회전»이 아니다.
#   📏 그리고 원장은 훨씬 오래 갖고 있다 — `pipeline-node-entry` 가 ***2026-08-19T04:14*** 에 ***24행*** 남아 있고
#      그 행들의 칸은 `node·round·runId` 뿐이다(= `graphId` 도입 «전»). ⇒ 보유는 최소 ***26일***.
#   ⇒ 📌 그러므로 아래 `observed:` 는 ***「낡았다」이지 「못 잰다」가 아니다.*** 근거 데이터는 창 «안»에 있다.
#      🪞 내가 «거른 뒤의 바닥»(graphId=self-implement 만 본 09-07)을 «보존 바닥»으로 읽었다.
#
#   📏 오늘(2026-09-14) 다시 잰 «노드 진입» 수 — 모집단 2,163 · declared 2,117 · 나머지 46은 필드 도입 «전»(09-07~09-08):
#      implement 474 · gate 455 · review 339 · rework 262 · open-pr 154 · main-sync 141 ·
#      regate 122 · merge 114 · plan 28 · decompose 28 · author 28 · investigate 12 · judge 6
#   ⛔⭐ 그런데 ***이것은 「간선 수」가 아니다*** — 이 그래프의 원장 행에는 `from`·`outcome` 칸이 «없고»,
#      간선은 (graphId, runId, attemptOrdinal) 로 «순서를 세워야» 나온다. `round` 는 순서 키가 아니다(재진입 때 0으로 돌아간다).
#      📄 그 함정 전수 = 내부 문서 §17
#      ⇒ 그래서 이 창은 ***간선 수를 고치지 않았다***. 고치려면 그 순서 세우기를 «먼저» 세워야 한다.
#   🩹 재는 명령(노드 진입까지):
#      bun bin/elanous.mjs logs --all --include-test --event pipeline-node-entry --limit 9000 --json --json-data
#      (data.graphId == "self-implement" 로 거르고 data.node 로 센다 · ⛔ limit 을 3배로 한 번 더 쳐서 절단을 확인한다)
#   ⛔⭐ 그리고 ***「거른 뒤의 가장 이른 행」을 「원장의 바닥」으로 읽지 마라*** — 그 둘은 다른 값이다.
#      바닥을 재려면 그 «필터를 빼고» 같은 이벤트의 가장 이른 행을 본다.

# ⛔⭐ `graph_id` 는 «원장의 조인 키»다 — 바꾸면 옛 표본과 «비교 불가»가 된다.
#   📏 2026-09-08 실측: 원장에 graphId="self-implement" 로 15건이 이미 쌓였다.
#   📌 RFC §4.2 는 이 템플릿을 `implement-loop` 이라 불렀지만, ***코드·원장이 쓰는 이름이 canonical***이다.
#      (파일 이름은 RFC 어휘를 남겨 둔다 — 사람이 찾는 이름과 조인 키가 다를 수 있다.)
graph_id: self-implement
version: 1
# ⭐ HARNESS-FULL-GRAPH (0.2.21 · 대표 10-08) — 입구부터 회수까지 «여정 전체»가 노드다.
#   📄 내부 문서 `RFC-harness-full-journey-as-graph-2026-10-08` · 코드 = src/self-dev/graph-journey-nodes.ts
#   ⛔ 여정 노드(intake … stopped)의 id 는 원장·라이브 그래프 화면의 조인 키다 — 바꾸지 마라.
#   🔀 분기는 «데이터»다(`on:` 상태 키 ⊕ `map:` 값→노드) — 기본 = 풀세트, 환경(substrate·freeze·queue)이 일부를 건너뛴다.
entry_node: intake
terminal_nodes: [cleanup, stopped]

# Runner-provided inputs are declared here so contract-flow can distinguish them from undeclared gaps.
runner_inputs: [ask_text, goal, worktree, branch, review-intent, head-sha, base-branch]

# ⚠️⛔⭐⭐ **`recipe:` 는 «오늘» 아무것도 «몰지» 않는다 — 문서다** (2026-09-09 실측 · 🅢 152차)
#   📏 사다리를 끝까지 내려간 결과:
#     ① YAML 이 선언한다                              ✅ (이 파일의 모든 노드)
#     ② 파서가 읽는다                                  ✅ `src/self-implement/graph-yaml.ts:116`
#     ③ ***컴파일이 «떨어뜨린다»***                     ⛔ `graph-templates.ts:specToTemplate` 가
#        `{nodeId, kind, maxVisits}` 만 옮긴다 — `GraphTemplateNode` 에 `recipe` 칸이 «없다»
#     ④ 그래서 실행이 그것을 «볼 수 없다»               ⛔ 읽는 실행 코드 0건
#   🔑 ⇒ ***`recipe:` 를 고쳐도 걸음은 안 바뀐다.*** 지금은 「이 노드가 무엇을 부르는지」의 «주석»이다.
#   ⚠️ `src/ui/chrome/*` 에도 `recipe` 가 있지만 ***다른 도메인의 같은 이름***이다 — 전수 검색 때 섞지 마라.
#   🔎 반증: rg -n "readonly recipe" src/self-implement/graph-templates.ts   (⇒ 0건이면 여전히 그렇다)
#
# ⚠️⛔⭐⭐ **`contract:`(노드별 도구 권한)도 «같은 자리»에 있다 — 다만 «검증»은 된다**
#   ① 선언 ✅  ② 파싱 ✅ `graph-yaml.ts:123`  ③ ⭐**검증** ✅ `graph-overlay-yaml.ts:152` 가 빈 `tools` 를 경고한다
#   ④ ***컴파일이 떨어뜨린다*** ⛔ (`GraphTemplateNode` 에 칸 없음)   ⑤ ***강제하는 실행 코드 0건*** ⛔
#   🔑 ⇒ ***여기 적은 도구 권한은 「선언」이고 「제한」이 아니다.*** 자식의 실제 권한은 코드가 정한다.
#   ⛔ 그러니 이 칸을 좁혀 「자식이 그 도구를 못 쓴다」고 읽지 마라 — 지금은 안 그렇다.
#   🔎 반증: rg -n "readonly contract" src/self-implement/graph-templates.ts   (⇒ 0건이면 여전히 그렇다)
# 🧩 `group:` = 나중에 `graphs/units/*.yaml` 로 들어 올릴 «한 노드로 부르는 부분 그래프» 단위(대표 10-08).
#   entry · dispatch · author · dispatch-pod · build · verify · land · recover · end
#   ⛔ 지금 파서는 이 칸을 «읽지 않는다»(무시) — 단위 호출은 0.2.22(RFC §6). 묶음은 «위치»가 아니라 이 태그로 정한다
#      (오버레이가 /nodes/<번호> 로 가리켜 노드를 재배열할 수 없다).
nodes:
  - node_id: author
    group: author
    kind: agent
    recipe: goal-author
    max_visits: 2
    progress: [authoring]
    terminal_stages: []
    contract:
      inputs: [ask_text]
      tools: read-only
      outputs: [goal_path, goal_id, goal_type, grounding_context]

  - node_id: plan
    group: author
    kind: agent
    recipe: harness-plan-rfc
    max_visits: 2
    progress: [planning]
    terminal_stages: []
    contract:
      inputs: [goal_path, ask_text, grounding_context]
      tools: read-only
      outputs: [rfc_path, markdown, arcs, open_questions]

  - node_id: decompose
    group: author
    kind: judge
    recipe: fabric-decompose-adapter
    max_visits: 12
    progress: [decomposing]
    terminal_stages: []
    contract:
      inputs: [arcs, grounding_context]
      tools: read-only
      outputs: [pieces, ordering, depends_on_edges, hot_path_edges, omitted_goal_count]

  - node_id: implement
    group: build
    kind: agent
    recipe: headless-goal-loop        # seams.implement → 자식 PTY
    max_visits: 12
    # 📏 2026-09-09 실측(런 79·중앙값 2.0·관측 최대 10·초과 런 9) — 초과 런의 완주율이 이내 런과 «같아» 병리가 아니다.
    #    ⛔ 이 수를 인용하지 말고 `bun scripts/measure-graph-visit-budget-drift.ts` 로 그때 다시 재라.
    progress: [implementing, implemented]
    terminal_stages: [aborted, timed-out, soft-stopped, parked]  # parked = H4 critical 미응답(2026-10-02) · 📏 #20101 이 코드 상수(pipeline-shape.ts:16)에 더했고 선언은 안 따라왔다 — graph-yaml.test.ts 가 잡았다(2026-09-26)
    contract:                          # 원문 §「노드별 모델·스킬·도구 권한 제한」의 세 칸
      inputs: [goal, worktree]
      tools: worktree-write            # 격리된 작업 공간
      outputs: [diff, summary, changed-files]

  - node_id: gate
    group: verify
    kind: gate
    recipe: gate-baseline              # 변경 파일 «범위» · 새 회귀만
    max_visits: 11
    # 📏 2026-09-09 실측(런 73·중앙값 3.0·관측 최대 9·초과 런 2) — 초과 런의 완주율이 이내 런과 «같아» 병리가 아니다.
    #    ⛔ 이 수를 인용하지 말고 `bun scripts/measure-graph-visit-budget-drift.ts` 로 그때 다시 재라.
    progress: [gating, gated]
    terminal_stages: []                # ⛔ 실패는 종결이 아니라 rework 로 간다
    contract:
      inputs: [worktree, changed-files]
      tools: read-and-run-tests        # ⛔ LLM 을 «안» 부른다
      outputs: [passed, gate-log, reflect-gate-facts]

  - node_id: review
    group: verify
    kind: judge
    recipe: pr-reviewer                # agent-substrate/pr-reviewer
    max_visits: 11
    # 📏 2026-09-09 실측(런 73·중앙값 2.0·관측 최대 9·초과 런 1) — 초과 런의 완주율이 이내 런과 «같아» 병리가 아니다.
    #    ⛔ 이 수를 인용하지 말고 `bun scripts/measure-graph-visit-budget-drift.ts` 로 그때 다시 재라.
    progress: [reviewing, reviewed]
    terminal_stages: [review-blocked]
    contract:
      inputs: [diff, review-intent]
      tools: read-only                 # ⛔ 구현 권한 «없음»
      outputs: [verdict, must-fix, should-fix, review-summary]

  - node_id: rework
    group: verify
    kind: agent
    recipe: headless-goal-loop         # 같은 루프의 다음 라운드
    max_visits: 10
    # 📏 2026-09-09 실측(런 52·중앙값 2.0·관측 최대 8·초과 런 4) — 초과 런의 완주율이 이내 런과 «같아» 병리가 아니다.
    #    ⛔ 이 수를 인용하지 말고 `bun scripts/measure-graph-visit-budget-drift.ts` 로 그때 다시 재라.
    progress: [implementing]
    terminal_stages: [gate-failed, review-blocked, no-changes]
    contract:
      inputs: [must-fix, gate-log, worktree]
      tools: worktree-write
      outputs: [diff, summary]

  - node_id: main-sync
    group: land
    kind: git
    recipe: seams-git-merge-main       # LLM 충돌해결 포함
    max_visits: 2
    progress: [gating, merge-conflict]
    terminal_stages: [merge-conflict]
    contract:
      inputs: [worktree, base-branch]
      tools: git-write
      outputs: [synced, conflicts]

  - node_id: regate
    group: land
    kind: gate
    recipe: gate-baseline              # 충돌해결 «뒤» 재-gate
    max_visits: 2
    progress: [gating]
    terminal_stages: [gate-failed]
    contract:
      inputs: [worktree]
      tools: read-and-run-tests
      outputs: [passed, gate-log]

  - node_id: open-pr
    group: land
    kind: git
    recipe: seams-gh-open-pr
    # 📏 실측 2026-09-08 (원장 30일 · 전 우주 · 걸음 191개 소급 계산):
    #   이 노드를 «두 번» 밟은 걸음이 3개 있었다(재시도는 «정상»이다).
    #   🩸 옛 선언 `1` 은 그 3개를 「예산 초과」로 만들었다 — ***선언이 실물보다 좁았다***.
    #   ⛔ 수를 늘리는 것이 아니라 «관측에 맞추는» 것이다. 다시 좁히려면 «표본»을 대라.
    max_visits: 2
    progress: [pr-opening, pr-opened]
    terminal_stages: [pr-declined, pr-opened, worktree-completed] # 📏 실측: orchestrator.ts:5860 progress ⊕ :5861 observe; 원장 self-implement/worktree-completed 2026-09-16T07:29:10Z.
    contract:
      inputs: [branch, review-summary]
      tools: gh-pr-create              # PR 생성에 «필요한 최소» 권한
      outputs: [pr-number, pr-url]

  - node_id: merge
    group: land
    kind: git
    recipe: seams-gh-merge-squash
    # 📏 실측 2026-09-08 (원장 30일 · 전 우주 · 걸음 191개 소급 계산):
    #   이 노드를 «두 번» 밟은 걸음이 3개 있었다(재시도는 «정상»이다).
    #   🩸 옛 선언 `1` 은 그 3개를 「예산 초과」로 만들었다 — ***선언이 실물보다 좁았다***.
    #   ⛔ 수를 늘리는 것이 아니라 «관측에 맞추는» 것이다. 다시 좁히려면 «표본»을 대라.
    max_visits: 2
    progress: [merging, merged]
    terminal_stages: [merged, pr-opened, merge-ready]  # merge-ready = Pod 런이 호스트 재게이트에 넘긴 자리(#20988)
    contract:
      inputs: [pr-number, head-sha]
      tools: gh-pr-merge
      outputs: [merged]

  # ⛔ 여정 노드는 «목록 끝»에 둔다 — 오버레이가 JSON 포인터(/nodes/<번호>)로 노드를 가리킨다(rework-patient). 앞에 끼우면 번호가 밀린다.
  # ───────── 여정 앞단: 입구 → 대기열 → 발사 관문 → 배치 ─────────
  - node_id: intake
    group: entry
    kind: observe
    recipe: harness-entrance            # src/harness/harness-cli-command.ts (say · ask · TUI /harness)
    max_visits: 1
    terminal_stages: []
    contract:
      inputs: [ask_text]
      tools: none
      outputs: [entrance, journey_key]

  - node_id: queue
    group: entry
    kind: gate
    recipe: harness-queue               # src/harness/harness-queue.ts (directSay 플래그 · 기본 끔 → 건너뜀)
    max_visits: 1
    terminal_stages: []
    contract:
      inputs: [entrance, seat]
      tools: queue-write
      outputs: [queue_item, queue_outcome]

  - node_id: launch-gate
    group: entry
    kind: gate
    recipe: pre-launch-gate             # harness-cli-command.ts preLaunchGate (예산 · 같은 골 활성 런)
    max_visits: 1
    terminal_stages: []
    contract:
      inputs: [goal_id, budget]
      tools: read-only
      outputs: [launch_decision]

  - node_id: dispatch
    group: dispatch
    kind: judge
    recipe: harness-substrate-select    # resolveLaunchSubstrate → substrate = local | pod
    max_visits: 2
    terminal_stages: []
    contract:
      inputs: [launch_decision]
      tools: read-only
      outputs: [substrate]

  # ───────── Pod 배치 (substrate == pod 일 때만 — local 은 건너뛴다) ─────────
  - node_id: pool-admit
    group: dispatch-pod
    kind: gate
    recipe: pod-pool-admission          # src/task-orchestrator/surfaces/self-implement-pod.ts (입장 · 멤버 슬롯 · 메모리 등급)
    max_visits: 4
    terminal_stages: []
    contract:
      inputs: [substrate, memory_tier]
      tools: pod-lease
      outputs: [pool_member]

  - node_id: image-sync
    group: dispatch-pod
    kind: gate
    recipe: pod-pool-image-sync         # src/task-orchestrator/surfaces/pod-pool.ts syncPoolImages (멤버별 · pack 한 번)
    max_visits: 4
    terminal_stages: []
    contract:
      inputs: [pool_member]
      tools: image-ship
      outputs: [image_current]

  - node_id: credential-refresh
    group: dispatch-pod
    kind: gate
    recipe: pod-credential-prerefresh   # self-implement-pod.ts podCodexCredentialWithPrerefresh
    max_visits: 4
    terminal_stages: []
    contract:
      inputs: [pool_member]
      tools: credential-refresh
      outputs: [usable_accounts]

  # ───────── 착지: 동결 검사 → (보류) → 병합 → 회수 ─────────
  - node_id: freeze-check
    group: land
    kind: gate
    recipe: landing-freeze-admission    # src/self-implement/frozen-merges.ts admitLandingMerge (병합 직전 한 곳)
    max_visits: 4
    terminal_stages: []
    contract:
      inputs: [pr-number]
      tools: read-only
      outputs: [freeze]

  - node_id: hold
    group: land
    kind: hitl
    recipe: frozen-merge-queue          # frozen-merges.ts queueFrozenMerge → sweepFrozenMerges 가 해제 뒤 재개
    max_visits: 4
    terminal_stages: []
    contract:
      inputs: [pr-number, head-sha]
      tools: queue-write
      outputs: [held]

  - node_id: cleanup
    group: land
    kind: git
    recipe: post-merge-cleanup          # src/self-implement/orchestrator.ts (워크트리 ⊕ 브랜치 회수)
    max_visits: 1
    terminal_stages: []
    contract:
      inputs: [worktree, branch]
      tools: git-write
      outputs: [cleaned]

  # ───────── 실패 쪽: 결과 해석 → 수확 → heal → 다음 한 수 ─────────
  - node_id: result-parse
    group: recover
    kind: observe
    recipe: pod-failure-reason          # src/task-orchestrator/surfaces/pod-failure-reason.ts
    max_visits: 4
    terminal_stages: []
    contract:
      inputs: [pod_log]
      tools: read-only
      outputs: [failure_reason]

  - node_id: salvage
    group: recover
    kind: git
    recipe: salvage-branch              # salvage/si-task-<job>/… (Pod Job 이 push · salvage-branches.ts 가 읽는다)
    max_visits: 4
    terminal_stages: []
    contract:
      inputs: [worktree]
      tools: git-write
      outputs: [salvage_ref]

  - node_id: heal
    group: recover
    kind: judge
    recipe: heal-intake                 # src/self-implement/heal-intake.ts (호스트에서만)
    max_visits: 4
    terminal_stages: []
    contract:
      inputs: [failure_reason, salvage_ref]
      tools: read-only
      outputs: [heal_signature]

  - node_id: next-move
    group: recover
    kind: judge
    recipe: task-agent-judge            # src/task-agent/judge.ts (판단부 → 실행부)
    max_visits: 4
    terminal_stages: []
    contract:
      inputs: [heal_signature]
      tools: read-only
      outputs: [next_action]

  - node_id: stopped
    group: end
    kind: observe
    recipe: journey-stopped             # 거절·포기 — 종결
    max_visits: 1
    terminal_stages: []
    contract:
      inputs: []
      tools: none
      outputs: []

# ═══════════════════════════════════════════════════════════════════════
# 엣지 — ⛔ 출처는 «코드 선언 ⊕ 원장 실측» 둘 다다. 어느 하나만 보면 틀린다.
#   📏 2026-09-08 실측 (pipeline-traversal-shadow 182 걸음 · 판정 함수가 «실제로 본» 것):
#      선언 13 · 관측 10 · 관측됐는데 선언에 «없는» 것 0  ⇒ 선언이 관측을 «전부» 덮는다
#      ⛔ 선언에 있는데 «한 번도 안 밟힌» 것 셋 — 죽은 코드가 «아니라» 심 폴백이다:
#         gate→main-sync · gate→open-pr · review→open-pr
#   🔑 그래서 엣지마다 `observed` 를 «값으로» 적는다 — 「선언했다」와 「돈다」를 가른다.
edges:
  # ───── 여정 앞단 — 분기는 «데이터»(on/map). 값은 코드가 낸다(RFC §4.3 ⑵) ─────
  - from: intake
    on: queue
    map:
      queued: queue                    # harness.queue.directSay 켬 ⊕ 자리 있음
      direct: launch-gate              # 기본(플래그 끔) — 대기열을 건너뛴다

  - from: queue
    on: queue_outcome
    map:
      launched: launch-gate            # 대기열이 발사한 자식이 다시 intake 를 밟는다(queueLaunchId 로 잇는다)
      waiting: stopped                 # 이 프로세스는 여기서 끝난다(발사는 대기열 tick 의 몫)
      refused: stopped                 # 같은 요청이 이미 대기열에 있다

  - from: launch-gate
    on: outcome
    map:
      pass: dispatch
      refuse: stopped

  - from: dispatch
    to: author

  - from: author
    to: plan

  - from: plan
    to: decompose

  # ⭐ 실행 칸(substrate)이 «Pod 쪽 세 노드»를 켜고 끈다 — local 은 곧장 구현.
  - from: decompose
    on: substrate
    map:
      local: implement
      pod: pool-admit

  - from: pool-admit
    on: outcome
    map:
      admitted: image-sync
      refused: stopped

  - from: image-sync
    to: credential-refresh

  - from: credential-refresh
    on: outcome
    map:
      usable: implement
      exhausted: stopped

  # 실패 쪽 — Pod 구현이 rc≠0 이면 결과 해석으로.
  - from: implement
    on: pod_result
    map:
      failed: result-parse

  - from: result-parse
    to: salvage

  # ⚠️ heal 은 실패 사건 «접수»다 — 호스트에서만(Pod 안에서는 시작 안 함 · POD-RESULT-PARSE).
  - from: salvage
    to: heal

  - from: heal
    to: next-move

  # 출구 라벨 = task-agent 판단부의 수(TaskMove · src/task-agent/judge.ts). 관측 배선은 0.2.22(판단이 카드 단위라 런 조인 먼저).
  - from: next-move
    on: move
    map:
      narrow-relaunch: dispatch
      salvage-relaunch: dispatch
      alternative: dispatch
      wait-retry: dispatch
      decision-card: stopped
      wait: stopped

  - from: implement
    to: gate
    observed: 353

  # ⛔⭐ 실측(2026-09-08 · RFC 승격 게이트 ⑴): 이 저장소의 분기는 «결과»만으로 안 갈린다 —
  #   `review` 로 갈지 `main-sync` 로 갈지는 ***그 심이 «주입됐나»***(s.reviewDiff · s.mergeMain)로 정해진다.
  #   ⇒ 그래서 `on: outcome` «하나»로는 이 그래프를 표현할 수 없다. `when` 을 같이 둔다.
  - from: gate
    on: outcome
    map:
      fail: rework                     # 관측 9
      pass: review                     # 관측 344
    # ⛔ 「결과」만으로 안 갈린다 — 심이 «주입됐나»가 다음 후보를 정한다(승격 게이트 ⑴ 실측).
    fallback:                          # review 심이 없으면 아래 순서로 내려간다
      - node: main-sync
        requires: [mergeMain, commitWork]
        observed: 0                    # ⛔ 이 배선에서는 «안 돈다» — 죽은 코드가 아니다
      - node: open-pr
        requires: []
        observed: 20                   # 2026-09-13 전 우주 걸음 관측: 20걸음 모두 2026-09-12 하루치

  - from: review
    on: outcome
    map:
      fail: rework                     # 관측 255
      pass: main-sync                  # 관측 87
    fallback:
      - node: open-pr
        requires: []
        observed: 0

  - from: rework
    to: implement
    observed: 194

  - from: main-sync
    on: outcome
    map:
      pass: regate                     # 관측 81
    fallback:
      - node: open-pr
        requires: []
        observed: 7                    # ⭐ 이것은 «실제로 돈다» — regate 를 건너뛴 판

  - from: regate
    to: open-pr
    observed: 80

  # ⭐ HARNESS-FULL-GRAPH — 코드 간선 open-pr→merge 사이에 «동결 검사»가 늘 끼어 있었다(병합 직전 한 곳).
  - from: open-pr
    to: freeze-check
    observed: 80                       # 옛 open-pr→merge 관측 — 그 사이에 동결 검사가 늘 있었다

  - from: freeze-check
    on: freeze
    map:
      open: merge
      frozen: hold
      taken: stopped                   # 다른 착지자(재개 sweep)가 그 PR 을 쥐었다

  - from: hold
    to: freeze-check                   # 해제 뒤 재검사

  - from: merge
    to: cleanup
