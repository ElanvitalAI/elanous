# ⭐ 지금 «실제로 도는» 파이프라인 — 출처는 외부 예시가 아니라 우리 아나토미다.
#   📄 내부 문서 `TECH-harness-execution-anatomy-current-state-2026-08-10` §8a (노드 × 모듈 × 액션 표)
#   📏 값의 출처(⛔ 지어낸 것 없음):
#      terminal_stages ← src/self-implement/pipeline-shape.ts  TERMINAL_STAGES_BY_NODE
#      progress        ← src/self-implement/orchestrator.ts    progress('…')
#      recipe          ← 아나토미 §8a 「모듈(어디서)」 칸
#      edges           ← pipeline-shape.ts  PIPELINE_EDGES_BY_NODE
#
# ⛔⭐ 이 파일이 코드 상수와 «어긋나면» 시험이 빨갛다(graph-yaml.test.ts).
#   승격이 끝나 그 상수가 은퇴하면 이 파일이 «유일한» 출처가 된다.

# ⏳⛔⭐⭐ **`observed:` 는 «늙는다» — 다만 「반증 불가」는 아니다** (🅢 실측 2026-09-14 · ⛔ 같은 날 «정정»)
#   🩸 이 자리에 처음 적었던 *"원장 보유 창 6일 ⇒ 09-08 자는 반증 불가"* 는 ***틀렸다.*** 아래가 다시 잰 값이다.
#   📏 `graphId` 가 붙은 «가장 이른» 행 = ***2026-09-07T22:40:56Z***
#      그 계측을 넣은 `#16073` 병합 = ***2026-09-07T22:32:34Z***   ⇒ ***8분 22초 뒤***
#      ⇒ 🔑 그 바닥은 ***「시대」(계측이 그때 들어왔다)***이지 «보존 회전»이 아니다.
#   📏 그리고 원장은 훨씬 오래 갖고 있다 — `pipeline-node-entry` 가 ***2026-08-19T04:14*** 에 ***24행*** 남아 있고
#      그 행들의 칸은 `node·round·runId` 뿐이다(= `graphId` 도입 «전»). ⇒ 보유는 최소 ***26일***.
#   ⇒ 📌 그러므로 아래 `observed:` 는 ***「낡았다」이지 「못 잰다」가 아니다.*** 근거 데이터는 창 «안»에 있다.
#      🪞 내가 «거른 뒤의 바닥»(graphId=self-implement 만 본 09-07)을 «보존 바닥»으로 읽었다.
#
#   📏 오늘(2026-09-14) 다시 잰 «노드 진입» 수 — 모집단 2,163 · declared 2,117 · 나머지 46은 필드 도입 «전»(09-07~09-08):
#      implement 474 · gate 455 · review 339 · rework 262 · open-pr 154 · main-sync 141 ·
#      regate 122 · merge 114 · plan 28 · decompose 28 · author 28 · investigate 12 · judge 6
#   ⛔⭐ 그런데 ***이것은 「간선 수」가 아니다*** — 이 그래프의 원장 행에는 `from`·`outcome` 칸이 «없고»,
#      간선은 (graphId, runId, attemptOrdinal) 로 «순서를 세워야» 나온다. `round` 는 순서 키가 아니다(재진입 때 0으로 돌아간다).
#      📄 그 함정 전수 = 내부 문서 §17
#      ⇒ 그래서 이 창은 ***간선 수를 고치지 않았다***. 고치려면 그 순서 세우기를 «먼저» 세워야 한다.
#   🩹 재는 명령(노드 진입까지):
#      bun bin/elanous.mjs logs --all --include-test --event pipeline-node-entry --limit 9000 --json --json-data
#      (data.graphId == "self-implement" 로 거르고 data.node 로 센다 · ⛔ limit 을 3배로 한 번 더 쳐서 절단을 확인한다)
#   ⛔⭐ 그리고 ***「거른 뒤의 가장 이른 행」을 「원장의 바닥」으로 읽지 마라*** — 그 둘은 다른 값이다.
#      바닥을 재려면 그 «필터를 빼고» 같은 이벤트의 가장 이른 행을 본다.

# ⛔⭐ `graph_id` 는 «원장의 조인 키»다 — 바꾸면 옛 표본과 «비교 불가»가 된다.
#   📏 2026-09-08 실측: 원장에 graphId="self-implement" 로 15건이 이미 쌓였다.
#   📌 RFC §4.2 는 이 템플릿을 `implement-loop` 이라 불렀지만, ***코드·원장이 쓰는 이름이 canonical***이다.
#      (파일 이름은 RFC 어휘를 남겨 둔다 — 사람이 찾는 이름과 조인 키가 다를 수 있다.)
graph_id: self-implement
version: 1
entry_node: author
terminal_nodes: [merge]

# Runner-provided inputs are declared here so contract-flow can distinguish them from undeclared gaps.
runner_inputs: [ask_text, goal, worktree, branch, review-intent, head-sha, base-branch]

# ⚠️⛔⭐⭐ **`recipe:` 는 «오늘» 아무것도 «몰지» 않는다 — 문서다** (2026-09-09 실측 · 🅢 152차)
#   📏 사다리를 끝까지 내려간 결과:
#     ① YAML 이 선언한다                              ✅ (이 파일의 모든 노드)
#     ② 파서가 읽는다                                  ✅ `src/self-implement/graph-yaml.ts:116`
#     ③ ***컴파일이 «떨어뜨린다»***                     ⛔ `graph-templates.ts:specToTemplate` 가
#        `{nodeId, kind, maxVisits}` 만 옮긴다 — `GraphTemplateNode` 에 `recipe` 칸이 «없다»
#     ④ 그래서 실행이 그것을 «볼 수 없다»               ⛔ 읽는 실행 코드 0건
#   🔑 ⇒ ***`recipe:` 를 고쳐도 걸음은 안 바뀐다.*** 지금은 「이 노드가 무엇을 부르는지」의 «주석»이다.
#   ⚠️ `src/ui/chrome/*` 에도 `recipe` 가 있지만 ***다른 도메인의 같은 이름***이다 — 전수 검색 때 섞지 마라.
#   🔎 반증: rg -n "readonly recipe" src/self-implement/graph-templates.ts   (⇒ 0건이면 여전히 그렇다)
#
# ⚠️⛔⭐⭐ **`contract:`(노드별 도구 권한)도 «같은 자리»에 있다 — 다만 «검증»은 된다**
#   ① 선언 ✅  ② 파싱 ✅ `graph-yaml.ts:123`  ③ ⭐**검증** ✅ `graph-overlay-yaml.ts:152` 가 빈 `tools` 를 경고한다
#   ④ ***컴파일이 떨어뜨린다*** ⛔ (`GraphTemplateNode` 에 칸 없음)   ⑤ ***강제하는 실행 코드 0건*** ⛔
#   🔑 ⇒ ***여기 적은 도구 권한은 「선언」이고 「제한」이 아니다.*** 자식의 실제 권한은 코드가 정한다.
#   ⛔ 그러니 이 칸을 좁혀 「자식이 그 도구를 못 쓴다」고 읽지 마라 — 지금은 안 그렇다.
#   🔎 반증: rg -n "readonly contract" src/self-implement/graph-templates.ts   (⇒ 0건이면 여전히 그렇다)
nodes:
  - node_id: author
    kind: agent
    recipe: goal-author
    max_visits: 2
    progress: [authoring]
    terminal_stages: []
    contract:
      inputs: [ask_text]
      tools: read-only
      outputs: [goal_path, goal_id, goal_type, grounding_context]

  - node_id: plan
    kind: agent
    recipe: harness-plan-rfc
    max_visits: 2
    progress: [planning]
    terminal_stages: []
    contract:
      inputs: [goal_path, ask_text, grounding_context]
      tools: read-only
      outputs: [rfc_path, markdown, arcs, open_questions]

  - node_id: decompose
    kind: judge
    recipe: fabric-decompose-adapter
    max_visits: 12
    progress: [decomposing]
    terminal_stages: []
    contract:
      inputs: [arcs, grounding_context]
      tools: read-only
      outputs: [pieces, ordering, depends_on_edges, hot_path_edges, omitted_goal_count]

  - node_id: implement
    kind: agent
    recipe: headless-goal-loop        # seams.implement → 자식 PTY
    max_visits: 12
    # 📏 2026-09-09 실측(런 79·중앙값 2.0·관측 최대 10·초과 런 9) — 초과 런의 완주율이 이내 런과 «같아» 병리가 아니다.
    #    ⛔ 이 수를 인용하지 말고 `bun scripts/measure-graph-visit-budget-drift.ts` 로 그때 다시 재라.
    progress: [implementing, implemented]
    terminal_stages: [aborted, timed-out, soft-stopped, parked]  # parked = H4 critical 미응답(2026-10-02) · 📏 #20101 이 코드 상수(pipeline-shape.ts:16)에 더했고 선언은 안 따라왔다 — graph-yaml.test.ts 가 잡았다(2026-09-26)
    contract:                          # 원문 §「노드별 모델·스킬·도구 권한 제한」의 세 칸
      inputs: [goal, worktree]
      tools: worktree-write            # 격리된 작업 공간
      outputs: [diff, summary, changed-files]

  - node_id: gate
    kind: gate
    recipe: gate-baseline              # 변경 파일 «범위» · 새 회귀만
    max_visits: 11
    # 📏 2026-09-09 실측(런 73·중앙값 3.0·관측 최대 9·초과 런 2) — 초과 런의 완주율이 이내 런과 «같아» 병리가 아니다.
    #    ⛔ 이 수를 인용하지 말고 `bun scripts/measure-graph-visit-budget-drift.ts` 로 그때 다시 재라.
    progress: [gating, gated]
    terminal_stages: []                # ⛔ 실패는 종결이 아니라 rework 로 간다
    contract:
      inputs: [worktree, changed-files]
      tools: read-and-run-tests        # ⛔ LLM 을 «안» 부른다
      outputs: [passed, gate-log, reflect-gate-facts]

  - node_id: review
    kind: judge
    recipe: pr-reviewer                # agent-substrate/pr-reviewer
    max_visits: 11
    # 📏 2026-09-09 실측(런 73·중앙값 2.0·관측 최대 9·초과 런 1) — 초과 런의 완주율이 이내 런과 «같아» 병리가 아니다.
    #    ⛔ 이 수를 인용하지 말고 `bun scripts/measure-graph-visit-budget-drift.ts` 로 그때 다시 재라.
    progress: [reviewing, reviewed]
    terminal_stages: [review-blocked]
    contract:
      inputs: [diff, review-intent]
      tools: read-only                 # ⛔ 구현 권한 «없음»
      outputs: [verdict, must-fix, should-fix, review-summary]

  - node_id: rework
    kind: agent
    recipe: headless-goal-loop         # 같은 루프의 다음 라운드
    max_visits: 10
    # 📏 2026-09-09 실측(런 52·중앙값 2.0·관측 최대 8·초과 런 4) — 초과 런의 완주율이 이내 런과 «같아» 병리가 아니다.
    #    ⛔ 이 수를 인용하지 말고 `bun scripts/measure-graph-visit-budget-drift.ts` 로 그때 다시 재라.
    progress: [implementing]
    terminal_stages: [gate-failed, review-blocked]
    contract:
      inputs: [must-fix, gate-log, worktree]
      tools: worktree-write
      outputs: [diff, summary]

  - node_id: main-sync
    kind: git
    recipe: seams-git-merge-main       # LLM 충돌해결 포함
    max_visits: 2
    progress: [gating, merge-conflict]
    terminal_stages: [merge-conflict]
    contract:
      inputs: [worktree, base-branch]
      tools: git-write
      outputs: [synced, conflicts]

  - node_id: regate
    kind: gate
    recipe: gate-baseline              # 충돌해결 «뒤» 재-gate
    max_visits: 2
    progress: [gating]
    terminal_stages: [gate-failed]
    contract:
      inputs: [worktree]
      tools: read-and-run-tests
      outputs: [passed, gate-log]

  - node_id: open-pr
    kind: git
    recipe: seams-gh-open-pr
    # 📏 실측 2026-09-08 (원장 30일 · 전 우주 · 걸음 191개 소급 계산):
    #   이 노드를 «두 번» 밟은 걸음이 3개 있었다(재시도는 «정상»이다).
    #   🩸 옛 선언 `1` 은 그 3개를 「예산 초과」로 만들었다 — ***선언이 실물보다 좁았다***.
    #   ⛔ 수를 늘리는 것이 아니라 «관측에 맞추는» 것이다. 다시 좁히려면 «표본»을 대라.
    max_visits: 2
    progress: [pr-opening, pr-opened]
    terminal_stages: [pr-declined, pr-opened, worktree-completed] # 📏 실측: orchestrator.ts:5860 progress ⊕ :5861 observe; 원장 self-implement/worktree-completed 2026-09-16T07:29:10Z.
    contract:
      inputs: [branch, review-summary]
      tools: gh-pr-create              # PR 생성에 «필요한 최소» 권한
      outputs: [pr-number, pr-url]

  - node_id: merge
    kind: git
    recipe: seams-gh-merge-squash
    # 📏 실측 2026-09-08 (원장 30일 · 전 우주 · 걸음 191개 소급 계산):
    #   이 노드를 «두 번» 밟은 걸음이 3개 있었다(재시도는 «정상»이다).
    #   🩸 옛 선언 `1` 은 그 3개를 「예산 초과」로 만들었다 — ***선언이 실물보다 좁았다***.
    #   ⛔ 수를 늘리는 것이 아니라 «관측에 맞추는» 것이다. 다시 좁히려면 «표본»을 대라.
    max_visits: 2
    progress: [merging, merged]
    terminal_stages: [merged, pr-opened, merge-ready]  # merge-ready = Pod 런이 호스트 재게이트에 넘긴 자리(#20988)
    contract:
      inputs: [pr-number, head-sha]
      tools: gh-pr-merge
      outputs: [merged]

# ═══════════════════════════════════════════════════════════════════════
# 엣지 — ⛔ 출처는 «코드 선언 ⊕ 원장 실측» 둘 다다. 어느 하나만 보면 틀린다.
#   📏 2026-09-08 실측 (pipeline-traversal-shadow 182 걸음 · 판정 함수가 «실제로 본» 것):
#      선언 13 · 관측 10 · 관측됐는데 선언에 «없는» 것 0  ⇒ 선언이 관측을 «전부» 덮는다
#      ⛔ 선언에 있는데 «한 번도 안 밟힌» 것 셋 — 죽은 코드가 «아니라» 심 폴백이다:
#         gate→main-sync · gate→open-pr · review→open-pr
#   🔑 그래서 엣지마다 `observed` 를 «값으로» 적는다 — 「선언했다」와 「돈다」를 가른다.
edges:
  - from: author
    to: plan

  - from: plan
    to: decompose

  - from: decompose
    to: implement

  - from: implement
    to: gate
    observed: 353

  # ⛔⭐ 실측(2026-09-08 · RFC 승격 게이트 ⑴): 이 저장소의 분기는 «결과»만으로 안 갈린다 —
  #   `review` 로 갈지 `main-sync` 로 갈지는 ***그 심이 «주입됐나»***(s.reviewDiff · s.mergeMain)로 정해진다.
  #   ⇒ 그래서 `on: outcome` «하나»로는 이 그래프를 표현할 수 없다. `when` 을 같이 둔다.
  - from: gate
    on: outcome
    map:
      fail: rework                     # 관측 9
      pass: review                     # 관측 344
    # ⛔ 「결과」만으로 안 갈린다 — 심이 «주입됐나»가 다음 후보를 정한다(승격 게이트 ⑴ 실측).
    fallback:                          # review 심이 없으면 아래 순서로 내려간다
      - node: main-sync
        requires: [mergeMain, commitWork]
        observed: 0                    # ⛔ 이 배선에서는 «안 돈다» — 죽은 코드가 아니다
      - node: open-pr
        requires: []
        observed: 20                   # 2026-09-13 전 우주 걸음 관측: 20걸음 모두 2026-09-12 하루치

  - from: review
    on: outcome
    map:
      fail: rework                     # 관측 255
      pass: main-sync                  # 관측 87
    fallback:
      - node: open-pr
        requires: []
        observed: 0

  - from: rework
    to: implement
    observed: 194

  - from: main-sync
    on: outcome
    map:
      pass: regate                     # 관측 81
    fallback:
      - node: open-pr
        requires: []
        observed: 7                    # ⭐ 이것은 «실제로 돈다» — regate 를 건너뛴 판

  - from: regate
    to: open-pr
    observed: 80

  - from: open-pr
    to: merge
    observed: 80
