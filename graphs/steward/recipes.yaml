steward-resync:
  command: 'bun "$ELANOUS_GRAPH_DIR/../../src/steward/resync-tick.ts"'
  timeout_ms: 660000
steward-rejudge:
  command: 'bun "$ELANOUS_GRAPH_DIR/../../src/steward/rejudge-tick.ts"'
  # The node kills its own `tasks rejudge` child at 600 s; this leaves room for the log line.
  timeout_ms: 660000
steward-ta-sweep:
  command: 'bun "$ELANOUS_GRAPH_DIR/../../src/steward/ta-sweep-tick.ts"'
  # Inline ledger sweep — card reads plus one stop line per stalled card, no child processes.
  timeout_ms: 60000
steward-sync:
  command: 'bun "$ELANOUS_GRAPH_DIR/../../src/steward/triage.ts" sync'
  timeout_ms: 120000
steward-triage:
  command: 'bun "$ELANOUS_GRAPH_DIR/../../src/steward/triage.ts" triage'
  timeout_ms: 600000
steward-schedule:
  command: 'bun "$ELANOUS_GRAPH_DIR/../../src/steward/triage.ts" schedule'
  # One working-backwards draft is a 70-100 s LLM call (10-05 measured) — 120 s left no room for the rest of the stage.
  timeout_ms: 300000
steward-report:
  command: 'bun "$ELANOUS_GRAPH_DIR/../../src/steward/triage.ts" report'
  timeout_ms: 120000
steward-release-day:
  command: 'bun "$ELANOUS_GRAPH_DIR/../../src/steward/release-day.ts"'
  timeout_ms: 30000
steward-entrance-dispatch-shadow:
  command: 'bun "$ELANOUS_GRAPH_DIR/../../src/steward/entrance-dispatch-shadow.ts"'
  timeout_ms: 120000
# STEWARD-SPACE (행정관 · 대표 11-25) — graphs/steward/space.yaml · one node script, deterministic, no LLM.
steward-space-r0:
  command: 'bun "$ELANOUS_GRAPH_DIR/../../src/steward/space/tick.ts" r0'
  # els ls · checklist status · two gh lists · receipt/verdict dirs — each child has its own 60 s bound.
  timeout_ms: 300000
steward-space-r1:
  command: 'bun "$ELANOUS_GRAPH_DIR/../../src/steward/space/tick.ts" r1'
  # Live assignment = one `seat assign` / `checklist set` child per row (cap 4 per scope).
  timeout_ms: 300000
steward-space-r2:
  command: 'bun "$ELANOUS_GRAPH_DIR/../../src/steward/space/tick.ts" r2'
  # Pregate children are detached — this node never waits for a gate.
  timeout_ms: 60000
steward-space-r3:
  command: 'bun "$ELANOUS_GRAPH_DIR/../../src/steward/space/tick.ts" r3'
  timeout_ms: 60000
steward-space-r4:
  command: 'bun "$ELANOUS_GRAPH_DIR/../../src/steward/space/tick.ts" r4'
  timeout_ms: 60000
steward-space-r5:
  command: 'bun "$ELANOUS_GRAPH_DIR/../../src/steward/space/tick.ts" r5'
  timeout_ms: 60000
steward-space-r6:
  command: 'bun "$ELANOUS_GRAPH_DIR/../../src/steward/space/tick.ts" r6'
  timeout_ms: 60000
steward-space-x:
  command: 'bun "$ELANOUS_GRAPH_DIR/../../src/steward/space/tick.ts" x'
  timeout_ms: 60000
