graph_id: wizard-loop
version: 1
entry_node: intake
terminal_nodes: [done, failed]
metadata:
  title: 마법사 루프 — 지시 하나를 근거 있는 산출물로 닫는다
  description: >-
    intake→classify→ground→gap→approve→acquire/generate→compose→verify→store→run→improve 순서를 도는
    마법사 루프 선언. 불변식 W1~W4 는 docs/RFC-smart-wizard-to-loop-collective-2026-10-08.md §A2 를 따른다.
    recipes.yaml 은 이 그래프의 명령 카탈로그다(로더는 recipes.yaml 을 템플릿으로 읽지 않는다).
limits:
  max_steps: 200
  max_wall_ms: 5400000
nodes:
  # W1 승인 포인트: approve 는 kind=hitl · recipe=approval:* 만 쓴다(사람 승인 없이는 진행하지 않는다).
  - { node_id: intake, kind: agent, recipe: 'cmd:intake', max_visits: 1 } # 지시 접수 | llm | 사용자 지시와 첨부 자료를 하나의 인테이크로 정리
  - { node_id: classify, kind: agent, recipe: 'cmd:classify', max_visits: 1 } # 지시 분류 | llm | 지시 유형·필요 산출물·위험도를 분류
  - { node_id: ground, kind: agent, recipe: 'cmd:ground', max_visits: 1 } # 근거 수집 | web-search | 지시가 전제하는 사실을 찾아 근거를 모은다
  - { node_id: gap, kind: judge, recipe: 'cmd:gap', max_visits: 2 } # 공백 판정 | check | 근거가 지시를 받치는지 판정한다 (결과: ok/gap/fail)
  - { node_id: approve, kind: hitl, recipe: 'approval:approve', max_visits: 1 } # 계획 승인 | approval | 사람이 계획과 근거를 보고 진행을 승인
  - { node_id: acquire, kind: agent, recipe: 'cmd:acquire', max_visits: 2 } # 자료 보강 | web-search | gap 이 지목한 공백을 메울 자료를 더 가져온다
  - { node_id: generate, kind: agent, recipe: 'cmd:generate', max_visits: 1 } # 초안 생성 | llm | 승인된 계획으로 초안을 만든다
  - { node_id: compose, kind: agent, recipe: 'cmd:compose', max_visits: 3 } # 구성 조립 | llm | 초안과 근거를 하나의 산출물로 조립 (verify rework 의 back-edge 대상)
  - { node_id: verify, kind: judge, recipe: 'cmd:verify', max_visits: 2 } # 검증 | check | 산출물이 지시·근거에 맞는지 검증 (결과: ok/rework/fail)
  - { node_id: store, kind: agent, recipe: 'cmd:store', max_visits: 1 } # 저장 | knowledge-rag | 검증된 산출물을 지식에 적재
  - { node_id: run, kind: agent, recipe: 'cmd:run', max_visits: 1 } # 실행 | llm | 산출물로 지시를 실제로 수행
  - { node_id: improve, kind: agent, recipe: 'cmd:improve', max_visits: 1 } # 개선 | llm | 실행 결과를 다음 루프의 개선점으로 남긴다
  - { node_id: done, kind: gate, recipe: none, max_visits: 1 } # 완료
  - { node_id: failed, kind: gate, recipe: none, max_visits: 1 } # 실패
edges:
  - { from: intake, on: outcome, map: { ok: classify, fail: failed } }
  - { from: classify, on: outcome, map: { ok: ground, fail: failed } }
  - { from: ground, on: outcome, map: { ok: gap, fail: failed } }
  # W2 공백 분기: gap 은 outcome 키로 approve(충분) / acquire(보강) 로 갈라진다.
  - { from: gap, on: outcome, map: { ok: approve, gap: acquire, fail: failed } }
  - { from: acquire, on: outcome, map: { ok: approve, fail: failed } }
  - { from: approve, on: outcome, map: { ok: generate, fail: failed } }
  - { from: generate, on: outcome, map: { ok: compose, fail: failed } }
  - { from: compose, on: outcome, map: { ok: verify, fail: failed } }
  # W3 되돌림: verify 실패(rework)는 compose 로 돌아가고 compose.max_visits=3 ≥ 2.
  - { from: verify, on: outcome, map: { ok: store, rework: compose, fail: failed } }
  - { from: store, on: outcome, map: { ok: run, fail: failed } }
  - { from: run, on: outcome, map: { ok: improve, fail: failed } }
  - { from: improve, on: outcome, map: { ok: done, fail: failed } }
