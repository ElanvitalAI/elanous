graph_id: op-retro
version: 1
loop:
  title: OP hourly retro
  root: 조율자
  managed_by: trigger-registry
  description: >-
    Condition-driven hourly retro: when the current hour still has no retro by :15 (the retro file was not updated
    since the hour started) the graph itself measures and appends the draft section, then opens ONE internal OP turn
    (retro-turn ledger · origin retro · exempt from the wake cap and late-wake folding) for the two judgement lines.
    Done-when = the retro file is updated in the window. Fallback clock:
    70 min without a fire. Shadow until two goal-verified fires, then the legacy watchdog retro branch is switched off.
  owner: OP
  trigger:
    condition:
      predicate:
        kind: all
        of:
          - { kind: minute-at-least, minute: 15 }
          - { kind: not-updated-since, path: '{seatState}/OP/retro/ELN-OP-RETRO-{date}.md', since: hour-start }
      cooldown_min: 30
      max_wait_min: 70
      on_max_wait: fire
  goal:
    kind: file-mtime
    path: '{seatState}/OP/retro/ELN-OP-RETRO-{date}.md'
  failure:
    goal_deadline_min: 20
    max_attempts: 2
    backoff_sec: [300]
  legacy:
    # eln-op-watchdog.sh retro branch (mm 10–19) — the watchdog skips its branch while this marker exists.
    kind: marker
    path: '{seatState}/OP/tools/.graph-cutover/op-retro'
  cutover_after: 2
entry_node: draft
terminal_nodes: [done, failed]
nodes:
  - node_id: draft
    kind: agent
    recipe: 'cmd:trigger-retro-draft'
    max_visits: 1
    input:
      # The graph measures and writes; OP only adds «원인 가설 1줄 + 다음 손잡이 1줄» in ONE internal turn (origin retro ·
      # retro-turn ledger · not a wake — the wake cap/fold swallowed the 18:xx·19:xx retros on 11-25).
      seat: OP
      file: '{seatState}/OP/retro/ELN-OP-RETRO-{date}.md'
      measures:
        - label: '6능력·바탕(op-eval)'
          cmd: [zsh, '{seatState}/OP/tools/op-eval.sh']
        - label: '착지 1h(main first-parent)'
          cmd: [zsh, -c, "git -C ~/elanous-hq/repo.git log --first-parent --since='1 hour ago' --oneline origin/main | wc -l | tr -d ' '"]
        - label: '초록(현재 판 칸)'
          cmd:
            - zsh
            - -c
            - |-
              cd ~/elanous-hq/repo.git && ELANOUS_TRACK=OP eln release checklist list --json 2>/dev/null | jq -r '(if type == "array" then . else .items end) as $c | "\([$c[] | select(.status == "green")] | length)/\($c | length)"'
        - label: '우편 1h(OP 받음·보냄)'
          cmd:
            - zsh
            - -c
            - |-
              eln logs --category msg --event msg.receipt.posted --since 1h --limit 3000 --json 2>/dev/null | jq -rs '[.[] | .data | fromjson?] | "in \(map(select(.to == "OP")) | length) · out \(map(select(.from == "OP")) | length)"'
  - { node_id: done, kind: gate, max_visits: 1 }
  - { node_id: failed, kind: gate, max_visits: 1 }
edges:
  - { from: draft, on: outcome, map: { ok: done, fail: failed, error: failed } }
