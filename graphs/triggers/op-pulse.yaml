graph_id: op-pulse
version: 1
loop:
  title: OP structural pulse
  root: 조율자
  managed_by: trigger-registry
  description: >-
    Replaces OP's pinned standing goal («씨앗 두 문서»). The phase (build · pre-cut · release-window · post-release ·
    demo-freeze · night · burst) picks a rhythm row from op-pulse.rhythm.yaml (cadence · targets · levers · beat).
    Fires when the phase changes (at once), when the phase cadence elapsed, or when a CEO crown line carries urgency
    urgent/all-in. The measure step (no LLM) writes the pulse table and routes: a gap, a phase change or a burst entry →
    ONE internal OP turn (origin pulse, via the pulse inbox — not a mail, not a wake); all green → one heartbeat line,
    no turn. Done-when = the pulse ledger has the window's goal line (all green, or beat mails verified by
    `eln pulse verify`). Shadow until two goal-verified fires; the legacy path is the pinned standing goal (marker).
    Absorbed op-retro (LOOP-AUDIT-APPLY 11-26 · loop audit «keep 5 · merge 4 → 2 · retire 1»): after the pulse step the
    `retro` node drafts the hourly retro once per clock hour (the first pulse of the hour; night cadence 90 min = a retro
    every 90 min) and queues its one retro turn. A retro failure never fails the pulse (its node record keeps the error).
  owner: OP
  absorbs: [op-retro]
  trigger:
    condition:
      predicate: { kind: pulse-due, rhythm: op-pulse.rhythm.yaml } # relative = beside this graph (graphs/triggers/)
      # The phase cadence (15–90 min) owns the spacing; the cooldown only damps a flapping phase edge.
      cooldown_min: 5
      max_wait_min: 70
      on_max_wait: fire
  goal:
    kind: ledger-line
    path: '{stateRoot}/loops/op-pulse.jsonl'
    contains: '"goal":"met","window":"{window}"'
  failure:
    goal_deadline_min: 20
    max_attempts: 2
    backoff_sec: [300]
  legacy:
    # The pinned «상시 목표» (seed docs) — OP clears it after cutover: eln seat goal-done OP '씨앗 두 문서' --from CLAUDE-OP --reason 'op-pulse live'.
    kind: marker
    path: '{seatState}/OP/tools/.graph-cutover/op-pulse'
  cutover_after: 1 # registry minimum; immediate live = `eln loop trigger promote op-pulse` (separate PR)
entry_node: measure
terminal_nodes: [done, failed]
nodes:
  - node_id: measure
    kind: agent
    recipe: 'cmd:trigger-pulse-measure'
    max_visits: 1
    input:
      rhythm: op-pulse.rhythm.yaml
  - node_id: turn
    kind: agent
    recipe: 'cmd:trigger-pulse-turn'
    max_visits: 1
    input: {}
  - node_id: retro
    kind: agent
    recipe: 'cmd:trigger-retro-draft'
    max_visits: 1
    input:
      # The graph measures and writes; OP only adds «원인 가설 1줄 + 다음 손잡이 1줄» in ONE internal turn (origin retro ·
      # retro-turn ledger · not a wake — the wake cap/fold swallowed the 18:xx·19:xx retros on 11-25).
      seat: OP
      every: hour # once per clock hour, not once per pulse window
      file: '{seatState}/OP/retro/ELN-OP-RETRO-{date}.md'
      # OP-NEXT-BEST-ACTION 3/3: «턴 결과» — the last hour's OP turns from fed-state; request-only turns (mail out, no
      # state change) are flagged ⚠ so the hypothesis line starts from them.
      turn_outcome: true
      measures:
        - label: '6능력·바탕(op-eval)'
          cmd: [zsh, '{seatState}/OP/tools/op-eval.sh']
        - label: '착지 1h(main first-parent)'
          cmd: [zsh, -c, "git -C ~/elanous-hq/repo.git log --first-parent --since='1 hour ago' --oneline origin/main | wc -l | tr -d ' '"]
        - label: '초록(현재 판 칸)'
          cmd:
            - zsh
            - -c
            - |-
              cd ~/elanous-hq/repo.git && ELANOUS_TRACK=OP eln release checklist list --json 2>/dev/null | jq -r '(if type == "array" then . else .items end) as $c | "\([$c[] | select(.status == "green")] | length)/\($c | length)"'
        - label: '우편 1h(OP 받음·보냄)'
          cmd:
            - zsh
            - -c
            - |-
              eln logs --category msg --event msg.receipt.posted --since 1h --limit 3000 --json 2>/dev/null | jq -rs '[.[] | .data | fromjson?] | "in \(map(select(.to == "OP")) | length) · out \(map(select(.from == "OP")) | length)"'
  - { node_id: done, kind: gate, max_visits: 1 }
  - { node_id: failed, kind: gate, max_visits: 1 }
edges:
  - { from: measure, on: outcome, map: { turn: turn, green: retro, fail: failed, error: failed } }
  - { from: turn, on: outcome, map: { ok: retro, fail: failed, error: failed } }
  - { from: retro, on: outcome, map: { ok: done, fail: done, error: done } }
