graph_id: res-reservation
version: 1
loop:
  title: RES release reservation (node-b)
  root: 자원국
  managed_by: trigger-registry
  description: >-
    RES-READY-POOL-RESERVATION §3–4. Fires on each release-phase transition read from the release graph's own state
    (release-graph/<v>/state.json): pre-cut (cutAt − 2h = rocket L-0 «reserve») and window (cut → publish + 45m = L-8
    «release reservation» with the max_wait tail) reserve node-b for the release critical path (non-release pregate slots on
    node-b → 1; pregate auto-select routes others to ready burst / LAN hosts); idle lifts it. Done-when = the goal ledger
    has this window's line.
  owner: RES
  trigger:
    condition:
      predicate: { kind: res, check: release-phase }
      cooldown_min: 0
  goal:
    kind: ledger-line
    path: '{stateRoot}/loops/res-reservation.jsonl'
    contains: '"window":"{window}"'
  failure:
    goal_deadline_min: 5
    max_attempts: 3
    backoff_sec: [30, 60]
  legacy:
    kind: marker
    path: '{seatState}/OP/tools/.graph-cutover/res-reservation'
  cutover_after: 1
entry_node: sync
terminal_nodes: [done, failed]
nodes:
  - { node_id: sync, kind: agent, recipe: 'cmd:res-reservation-sync', max_visits: 1 }
  - { node_id: mark, kind: agent, recipe: 'cmd:res-window-done', max_visits: 1, input: { ledger: '{stateRoot}/loops/res-reservation.jsonl' } }
  - { node_id: done, kind: gate, max_visits: 1 }
  - { node_id: failed, kind: gate, max_visits: 1 }
edges:
  - { from: sync, on: outcome, map: { ok: mark, fail: failed, error: failed } }
  - { from: mark, on: outcome, map: { ok: done, fail: failed, error: failed } }
