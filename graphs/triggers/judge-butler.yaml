# Tick shim for the loop agent judge-butler (JUDGE-BUTLER-V3-LISTED · YAML-SUPERVISORS-RUNTIME). The trigger — wake (condition:
# a new pregate receipt · land-graph ledger · HOLD ledger · checklist change, at least every 10 min = the ✋ SLA) · failure · owner
# (JUD, the L0) · goal (last-tick.json) — is defined ONLY in graphs/loop-agents/judge-butler/agent.yaml `wake:`; the trigger
# registry builds it from there (src/loop-agent/v3/agent-trigger.ts). This file only names the agent and runs one tick through the
# shared v3 door (`eln loop agent judge-butler tick` · alias `eln loop butler tick`). Do not add loop.trigger here.
graph_id: judge-butler
version: 1
loop:
  from_agent: judge-butler
entry_node: tick
terminal_nodes: [done, failed]
nodes:
  - node_id: tick
    kind: agent
    recipe: 'cmd:judge-butler-tick'
    max_visits: 1
  - { node_id: done, kind: gate, max_visits: 1 }
  - { node_id: failed, kind: gate, max_visits: 1 }
edges:
  - { from: tick, on: outcome, map: { ok: done, fail: failed, error: failed } }
