graph_id: op-bulletin
version: 1
loop:
  title: OP 30-minute federal bulletin
  root: 조율자
  managed_by: trigger-registry
  description: >-
    Condition-driven federal bulletin: fires when landed count, idle seats, or raised hands changed since the last
    bulletin (at most every 15 min), or after 30 min regardless. The graph writes the bulletin itself (no LLM): the facts
    go to seat-state/OPS/BULLETIN-NOW.md (the previous one is appended to the day's BULLETIN-LOG), a kind-bulletin mail
    goes to every coordinator (no expiry · read on the receiver's next idle), and ONE internal OP turn (retro-turn
    ledger · not a wake) asks only for the two judgement lines. Done-when = BULLETIN-NOW.md rewritten in the window —
    met by the graph (11-26: the old OP→OP wake became a self-wake under anti-flood F and the file went stale at 07:09).
  owner: OP
  trigger:
    condition:
      predicate: { kind: state-changed, parts: [landed-count, idle-seats, hands-up-count] }
      cooldown_min: 15
      max_wait_min: 30
      on_max_wait: fire
  goal:
    kind: file-mtime
    path: '{seatState}/OPS/BULLETIN-NOW.md'
  failure:
    goal_deadline_min: 20
    max_attempts: 2
    backoff_sec: [180]
  legacy:
    kind: marker
    path: '{seatState}/OP/tools/.graph-cutover/op-bulletin'
  cutover_after: 2
entry_node: write
terminal_nodes: [done, failed]
nodes:
  - node_id: write
    kind: agent
    recipe: 'cmd:trigger-bulletin-write'
    max_visits: 1
    input:
      # Facts only (bulletin-write.ts); OP adds «병목 판단 1줄 + 다음 지시 1줄» in ONE internal turn.
      # Recipients: omitted → every space leader under HQ in the org map (eln org show).
      from: OP
      file: '{seatState}/OPS/BULLETIN-NOW.md'
      log: '{seatState}/OPS/BULLETIN-LOG-{date}.md'
  - { node_id: done, kind: gate, max_visits: 1 }
  - { node_id: failed, kind: gate, max_visits: 1 }
edges:
  - { from: write, on: outcome, map: { ok: done, fail: failed, error: failed } }
