# Command recipes for trigger-registry graphs (src/loops/trigger-registry.ts · SCHEDULER-TO-GRAPH-RUNNER).
trigger-wake:
  command: 'bun "$ELANOUS_GRAPH_DIR/../../src/loops/trigger-nodes.ts" wake'
  timeout_ms: 60000 # One msg post (or one shadow receipt) — a stuck post must not hold the tick.
trigger-idle-probe:
  command: 'bun "$ELANOUS_GRAPH_DIR/../../src/loops/trigger-nodes.ts" idle-probe'
  timeout_ms: 30000 # A few stat() calls and one ledger append.
trigger-pulse-measure:
  command: 'bun "$ELANOUS_GRAPH_DIR/../../src/loops/trigger-nodes.ts" pulse-measure'
  timeout_ms: 120000 # One git fetch + ledger reads + unified usage (each probe fails open).
trigger-pulse-turn:
  command: 'bun "$ELANOUS_GRAPH_DIR/../../src/loops/trigger-nodes.ts" pulse-turn'
  timeout_ms: 30000 # One inbox file write (or one shadow receipt).
trigger-retro-draft:
  command: 'bun "$ELANOUS_GRAPH_DIR/../../src/loops/trigger-nodes.ts" retro-draft'
  timeout_ms: 600000 # Up to four measure commands (each ≤150 s) and one file append.
trigger-bulletin-write:
  command: 'bun "$ELANOUS_GRAPH_DIR/../../src/loops/trigger-nodes.ts" bulletin-write'
  timeout_ms: 240000 # git rev-list · els ls · one ledger read, one file rewrite, ≤ 8 msg posts (each a short CLI spawn).
trigger-watch-sweep:
  command: 'bun "$ELANOUS_GRAPH_DIR/../../src/loops/trigger-nodes.ts" watch-sweep'
  timeout_ms: 110000 # Waker files + local ledger probes; network probes (gh pr view) only for unexpired pr/review watches.
trigger-decision-bus-sync:
  command: 'bun "$ELANOUS_GRAPH_DIR/../../src/loops/trigger-nodes.ts" decision-bus-sync'
  timeout_ms: 90000 # One ledger read, git log/show over a day of docs commits, ≤ max_per_tick bus appends, one msg write.
# RES burst pool (src/res-graphs/res-nodes.ts · RES-READY-POOL-RESERVATION). Machines only via $ELANOUS_RES_ACTUATOR.
res-ready-pick:
  command: 'bun "$ELANOUS_GRAPH_DIR/../../src/res-graphs/res-nodes.ts" ready-pick'
  timeout_ms: 30000 # Reads ready/lease files, writes one lease row.
res-step-start:
  command: 'bun "$ELANOUS_GRAPH_DIR/../../src/res-graphs/res-nodes.ts" step:start'
  timeout_ms: 660000 # cloud-vm.sh start waits for the instance state.
res-step-sanitize:
  command: 'bun "$ELANOUS_GRAPH_DIR/../../src/res-graphs/res-nodes.ts" step:sanitize'
  timeout_ms: 360000 # ssh late boot ≤ 5 min + cleanup.
res-step-catchup:
  command: 'bun "$ELANOUS_GRAPH_DIR/../../src/res-graphs/res-nodes.ts" step:catchup'
  timeout_ms: 1960000 # rail-catchup: ssh wait 5 min + rail ≤ 25 min.
res-step-auth:
  command: 'bun "$ELANOUS_GRAPH_DIR/../../src/res-graphs/res-nodes.ts" step:auth'
  timeout_ms: 360000 # One codex mirror push.
res-step-smoke:
  command: 'bun "$ELANOUS_GRAPH_DIR/../../src/res-graphs/res-nodes.ts" step:smoke'
  timeout_ms: 2760000 # One light pregate.
res-ready-mark:
  command: 'bun "$ELANOUS_GRAPH_DIR/../../src/res-graphs/res-nodes.ts" ready-mark'
  timeout_ms: 60000 # ready.json + board (+ optional image request).
res-run-fail:
  command: 'bun "$ELANOUS_GRAPH_DIR/../../src/res-graphs/res-nodes.ts" run-fail'
  timeout_ms: 660000 # Marks failed and stops the host it started.
res-run-stop:
  command: 'bun "$ELANOUS_GRAPH_DIR/../../src/res-graphs/res-nodes.ts" run-stop'
  timeout_ms: 660000 # cloud-vm.sh stop + receipt.
res-lease-route:
  command: 'bun "$ELANOUS_GRAPH_DIR/../../src/res-graphs/res-nodes.ts" lease-route'
  timeout_ms: 30000 # Reads leases.json.
res-lease-start:
  command: 'bun "$ELANOUS_GRAPH_DIR/../../src/res-graphs/res-nodes.ts" lease-start'
  timeout_ms: 660000 # cloud-vm.sh start + permit.
res-lease-register:
  command: 'bun "$ELANOUS_GRAPH_DIR/../../src/res-graphs/res-nodes.ts" lease-register'
  timeout_ms: 30000 # burst-hosts.json row.
res-lease-drain:
  command: 'bun "$ELANOUS_GRAPH_DIR/../../src/res-graphs/res-nodes.ts" lease-drain'
  timeout_ms: 90000 # Unregister + one inflight probe.
res-reservation-sync:
  command: 'bun "$ELANOUS_GRAPH_DIR/../../src/res-graphs/res-nodes.ts" reservation-sync'
  timeout_ms: 30000 # Reads release graph state, writes reservation.json.
res-window-done:
  command: 'bun "$ELANOUS_GRAPH_DIR/../../src/res-graphs/res-nodes.ts" window-done'
  timeout_ms: 30000 # One goal ledger line.
# BOARD-STEWARD (src/steward/board · steward:BOARD · OP-direct). One federation board: rank · cut list · health · cards.
board-steward-tick:
  command: 'bun "$ELANOUS_GRAPH_DIR/../../src/steward/board/nodes.ts"'
  timeout_ms: 90000 # Checklist read + els panes + one gh release view (each fails open).
space-advisor-tick:
  command: 'bun "$ELANOUS_GRAPH_DIR/../../src/steward/space/advisor-node.ts"'
  timeout_ms: 90000 # One gh pr list + git log/worktree (writer-check ports, each 20 s bounded) + msg ledger writes.
# RELEASE-TRAFFIC (src/res-graphs/release-traffic.ts · SCHEDULER-TO-GRAPH-RUNNER). Converges pregate slots to the release phase.
release-traffic-tick:
  command: 'bun "$ELANOUS_GRAPH_DIR/../../src/res-graphs/release-traffic.ts"'
  timeout_ms: 1900000 # A few config get/set + one ssh probe; update-all after publish can take ≤30 min.
guardian-pulse:
  command: 'bun "$ELANOUS_GRAPH_DIR/../../bin/elanous.mjs" loop guardian pulse --json >/dev/null && echo "{\"outcome\":\"ok\"}" || echo "{\"outcome\":\"fail\"}"'
  timeout_ms: 600000 # 4 host probes (ssh ≤ 10 s) every pulse; a spawned 임대관/대식세포 adds one ps + exact-PID kills per host.
guardian-tick:
  command: 'bun "$ELANOUS_GRAPH_DIR/../../bin/elanous.mjs" loop guardian tick --json >/dev/null && echo "{\"outcome\":\"ok\"}" || echo "{\"outcome\":\"fail\"}"'
  timeout_ms: 600000 # 5 hosts × (probe + ps + kill ≤ 60 s) over ssh · ≤10 voice turns.
# JUDGE-BUTLER-V3-LISTED: the shared v3 door (agent.yaml body judge-butler.tick) · `loop butler tick` is its alias
judge-butler-tick:
  command: 'bun "$ELANOUS_GRAPH_DIR/../../bin/elanous.mjs" loop agent judge-butler tick --json >/dev/null && echo "{\"outcome\":\"ok\"}" || echo "{\"outcome\":\"fail\"}"'
  timeout_ms: 600000 # gh pr view per newly merged PR (cached) · receipt focused reads (ssh ≤ 30 s each) · ≤10 voice turns (≤120 s each).
# DEV-REVIEW-COMMON: post-impl@1 on each PR whose FIRST pregate receipt landed after the watermark (src/kit/dev-review/live.ts)
dev-review-post-impl-tick:
  command: 'bun "$ELANOUS_GRAPH_DIR/../../bin/elanous.mjs" work review scan --json >/dev/null && echo "{\"outcome\":\"ok\"}" || echo "{\"outcome\":\"fail\"}"'
  dry_run_command: 'bun "$ELANOUS_GRAPH_DIR/../../bin/elanous.mjs" work review scan --dry-run --json >/dev/null && echo "{\"outcome\":\"ok\"}" || echo "{\"outcome\":\"fail\"}"'
  timeout_ms: 900000 # ≤ 3 PRs a tick × (gh pr view ≤ 30 s + judge decomposition ⊕ judgment ≤ 3 × 90 s).
land-graph-tick:
  command: 'bun "$ELANOUS_GRAPH_DIR/../../bin/elanous.mjs" land graph tick --json >/dev/null && echo "{\"outcome\":\"ok\"}" || echo "{\"outcome\":\"fail\"}"'
  timeout_ms: 2700000 # Live: up to 2 lands × op-direct-land-v2 preflight (~20 min each on minim5).
land-steward-tick:
  command: 'bun "$ELANOUS_GRAPH_DIR/../../bin/elanous.mjs" land steward tick --json >/dev/null && echo "{\"outcome\":\"ok\"}" || echo "{\"outcome\":\"fail\"}"'
  timeout_ms: 2700000 # The land-graph tick (≤ 2 lands × ~20 min v2 preflight) + KPI from local files + ≤ 4 els channel lines (10 s each).
land-rail-watch:
  command: 'bun "$ELANOUS_GRAPH_DIR/../../bin/elanous.mjs" land rail-watch --json >/dev/null && echo "{\"outcome\":\"ok\"}" || echo "{\"outcome\":\"fail\"}"'
  timeout_ms: 420000 # 4 smokes × ≤ 60 s + one git fetch/log; same-rail ticks return at once.
macrophage-agent-tick:
  command: 'bun "$ELANOUS_GRAPH_DIR/../../bin/elanous.mjs" loop agent macrophage tick --json >/dev/null && echo "{\"outcome\":\"ok\"}" || echo "{\"outcome\":\"fail\"}"'
  timeout_ms: 600000 # one v2 tick: observe + ≤max_per_tick actions + ≤5 mail voice turns (≤120 s each).
watchers-check-agent-tick:
  command: 'bun "$ELANOUS_GRAPH_DIR/../../bin/elanous.mjs" loop agent watchers-check tick --json >/dev/null && echo "{\"outcome\":\"ok\"}" || echo "{\"outcome\":\"fail\"}"'
  timeout_ms: 600000 # one v2 tick: observe + ≤max_per_tick actions + ≤5 mail voice turns (≤120 s each).
silence-watch-agent-tick:
  command: 'bun "$ELANOUS_GRAPH_DIR/../../bin/elanous.mjs" loop agent silence-watch tick --json >/dev/null && echo "{\"outcome\":\"ok\"}" || echo "{\"outcome\":\"fail\"}"'
  timeout_ms: 600000 # one v2 tick: observe + ≤max_per_tick actions + ≤5 mail voice turns (≤120 s each).
train-manager-agent-tick:
  command: 'bun "$ELANOUS_GRAPH_DIR/../../bin/elanous.mjs" loop agent train-manager tick --json >/dev/null && echo "{\"outcome\":\"ok\"}" || echo "{\"outcome\":\"fail\"}"'
  timeout_ms: 600000 # one v2 tick: observe + ≤max_per_tick actions + ≤5 mail voice turns (≤120 s each).
release-rocket-agent-tick:
  command: 'bun "$ELANOUS_GRAPH_DIR/../../bin/elanous.mjs" loop agent release-rocket tick --json >/dev/null && echo "{\"outcome\":\"ok\"}" || echo "{\"outcome\":\"fail\"}"'
  timeout_ms: 600000 # one v2 tick: observe + ≤max_per_tick actions + ≤5 mail voice turns (≤120 s each).
hand-steward-agent-tick:
  command: 'bun "$ELANOUS_GRAPH_DIR/../../bin/elanous.mjs" loop agent hand-steward tick --json >/dev/null && echo "{\"outcome\":\"ok\"}" || echo "{\"outcome\":\"fail\"}"'
  timeout_ms: 600000 # one v2 tick: observe + ≤max_per_tick actions + ≤5 mail voice turns (≤120 s each).
run-supervisor-agent-tick:
  command: 'bun "$ELANOUS_GRAPH_DIR/../../bin/elanous.mjs" loop agent run-supervisor tick --json >/dev/null && echo "{\"outcome\":\"ok\"}" || echo "{\"outcome\":\"fail\"}"'
  timeout_ms: 600000 # one v2 tick: observe + ≤max_per_tick actions + ≤5 mail voice turns (≤120 s each).
run-doctor-agent-tick:
  command: 'bun "$ELANOUS_GRAPH_DIR/../../bin/elanous.mjs" loop agent run-doctor tick --json >/dev/null && echo "{\"outcome\":\"ok\"}" || echo "{\"outcome\":\"fail\"}"'
  timeout_ms: 600000 # one v2 tick: observe + ≤max_per_tick actions + ≤5 mail voice turns (≤120 s each).
autopsy-agent-tick:
  command: 'bun "$ELANOUS_GRAPH_DIR/../../bin/elanous.mjs" loop agent autopsy tick --json >/dev/null && echo "{\"outcome\":\"ok\"}" || echo "{\"outcome\":\"fail\"}"'
  timeout_ms: 600000 # one v2 tick: observe + ≤max_per_tick actions + ≤5 mail voice turns (≤120 s each).
fed-analyst-agent-tick:
  command: 'bun "$ELANOUS_GRAPH_DIR/../../bin/elanous.mjs" loop agent fed-analyst tick --json >/dev/null && echo "{\"outcome\":\"ok\"}" || echo "{\"outcome\":\"fail\"}"'
  timeout_ms: 600000 # one v2 tick: observe (msg store window · fed kpi · registry · board) + publish (one cheap LLM call ≤60 s) + ≤6 case rows.
supervisor-auditor-agent-tick:
  command: 'bun "$ELANOUS_GRAPH_DIR/../../bin/elanous.mjs" loop agent supervisor-auditor tick --json >/dev/null && echo "{\"outcome\":\"ok\"}" || echo "{\"outcome\":\"fail\"}"'
  timeout_ms: 600000 # one v2 tick: observe (every loop-agent home ⊕ registry rows) + ≤5 actions (registry request · mail · bus · telegram) + ≤5 mail voice turns.
rail-canary-agent-tick:
  command: 'bun "$ELANOUS_GRAPH_DIR/../../bin/elanous.mjs" loop agent rail-canary tick --json >/dev/null && echo "{\"outcome\":\"ok\"}" || echo "{\"outcome\":\"fail\"}"'
  timeout_ms: 600000 # one v2 tick: observe (install.json ⊕ 5 probes ≤ 20 s each ⊕ ≤ 1 confirm re-read 60 s apart) + ≤2 actions (rollback door ⊕ 2 restarts ≤ 120 s each · git fetch/log · mail).
# WORLD-REGISTRY (src/resource-ledger/world-*.ts) — the guardian's world-ledger sweep (LLM 0 · writes as loop:guardian).
world-sweep-tick:
  command: 'bun "$ELANOUS_GRAPH_DIR/../../bin/elanous.mjs" world sweep --by loop:guardian --json >/dev/null && echo "{\"outcome\":\"ok\"}" || echo "{\"outcome\":\"fail\"}"'
  timeout_ms: 600000 # One probe per host (ssh ≤ 25 s each, 6 hosts) + listAllLoops + one els pane list (≤ 15 s).
# steward:mail shadow (src/kit/mail-route/steward-mail-shadow.ts · STEWARD-MAIL). Read-only mail ledger · ≤ 30 Jev calls.
trigger-steward-mail-shadow:
  command: 'bun "$ELANOUS_GRAPH_DIR/../../src/kit/mail-route/steward-mail-shadow.ts"'
  timeout_ms: 150000 # One window query + up to 30 Jev calls (4 at a time · 8 s timeout each) + one jsonl append.
# GH-PROXY-LAYER ② (src/kit/gh-proxy/mirror-node.ts · graphs/triggers/gh-mirror.yaml). LLM 0 · prints its own outcome line.
gh-mirror-refresh:
  command: 'bun "$ELANOUS_GRAPH_DIR/../../src/kit/gh-proxy/mirror-node.ts" refresh'
  timeout_ms: 720000 # ≤ refreshes_per_tick (2) × fetch_timeout_sec (300 s) + refresh_min_interval_sec (60 s) between them.
