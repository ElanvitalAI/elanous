# Tick shim for the loop agent guardian (GUARDIAN-V3-SMART · YAML-SUPERVISORS-RUNTIME). The trigger — wake (condition) · failure ·
# owner · goal (the pulse snapshot last-pulse.json) — is defined ONLY in graphs/loop-agents/guardian/agent.yaml `wake:`; the trigger
# registry builds it from there (src/loop-agent/v3/agent-trigger.ts). This file only names the agent and runs one pulse (the thin
# body: world aggregate · the seven subs spawned per event / cadence · detector ladders · final route). Do not add loop.trigger here.
graph_id: guardian
version: 1
loop:
  from_agent: guardian
entry_node: tick
terminal_nodes: [done, failed]
nodes:
  - node_id: tick
    kind: agent
    recipe: 'cmd:guardian-pulse'
    max_visits: 1
  - { node_id: done, kind: gate, max_visits: 1 }
  - { node_id: failed, kind: gate, max_visits: 1 }
edges:
  - { from: tick, on: outcome, map: { ok: done, fail: failed, error: failed } }
