# Tick shim for the loop agent rail-canary (YAML-SUPERVISORS-RUNTIME). The trigger — wake (condition: install.json changed ⊕
# max_wait 5 min) · failure · owner (L0 by duty) · goal — is defined ONLY in graphs/loop-agents/rail-canary/agent.yaml `wake:`;
# the trigger registry builds it from there (src/loop-agent/v3/agent-trigger.ts). This file only names the agent and runs one
# tick. Do not add loop.trigger here.
graph_id: rail-canary-agent
version: 1
loop:
  from_agent: rail-canary
entry_node: tick
terminal_nodes: [done, failed]
nodes:
  - node_id: tick
    kind: agent
    recipe: 'cmd:rail-canary-agent-tick'
    max_visits: 1
  - { node_id: done, kind: gate, max_visits: 1 }
  - { node_id: failed, kind: gate, max_visits: 1 }
edges:
  - { from: tick, on: outcome, map: { ok: done, fail: failed, error: failed } }
