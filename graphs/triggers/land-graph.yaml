graph_id: land-graph
version: 1
loop:
  title: 착지 집사 (land-steward) — land graph body · train manager · finisher · cell link · KPI · voice
  root: 판정국
  managed_by: trigger-registry
  description: >-
    Condition-driven landing: fires when a new pregate receipt appears (PREGATE-GREEN changed) or every 10 min.
    One tick decides every open non-draft PR (same-head receipt · focused 0 fail · security-4 · hold) and, in live,
    lands up to land.graph.slots through op-direct-land-v2.sh (ratchet · tsc · isolation on the merge result) with a
    post-notice to OP and a COACH-ACTIONS row. Refusals → one typed card to the author with the exact fix.
    Shadow (config land.graph.mode ≠ live) records would-land / would-refuse only. Done-when = last-tick.json rewritten.
    LAND-STEWARD (loop agent v2 · graphs/loop-agents/land-steward): the tick runs `eln land steward tick` — the same body with
    the train manager's order and the steward as terminal owner of refusals (no land mail to TC/OP except security-4), KPI
    (lands/h ≥ 10 · landable ≥ 50% · finisher wait p50 ≤ 30 m · refusals without next action 0) and one channel line per
    breach (loop:land-steward). Level: eln land steward level shadow|off → the plain body.
  owner: TC # org duty «landing» (landingOwner) — veto stays JUD
  trigger:
    condition:
      predicate: { kind: state-changed, parts: [{ file: '{seatState}/RES/evidence/PREGATE-GREEN' }, { file: '{seatState}/RES/evidence/PREGATE-RED' }] }
      cooldown_min: 2
      max_wait_min: 10
      on_max_wait: fire
  goal:
    kind: file-mtime
    path: '{stateRoot}/land-graph/last-tick.json'
  failure:
    goal_deadline_min: 45
    max_attempts: 2
    backoff_sec: [120]
  legacy:
    kind: marker
    path: '{seatState}/OP/tools/.graph-cutover/land-graph'
  cutover_after: 2
entry_node: tick
terminal_nodes: [done, failed]
nodes:
  - node_id: tick
    kind: agent
    recipe: 'cmd:land-steward-tick'
    max_visits: 1
  - { node_id: done, kind: gate, max_visits: 1 }
  - { node_id: failed, kind: gate, max_visits: 1 }
edges:
  - { from: tick, on: outcome, map: { ok: done, fail: failed, error: failed } }
