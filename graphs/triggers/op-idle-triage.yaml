graph_id: op-idle-triage
version: 1
loop:
  title: OP idle triage
  root: 조율자
  managed_by: trigger-registry
  description: >-
    Condition-driven idle triage: fires when a hand seat has been idle ≥ 10 min while it owns an open yellow cell (each
    new set of such seats fires once, at most every 10 min). The probe records one triage line for the fire and wakes
    OP with the rule-11 prescription. Done-when = the triage ledger has this fire's line. Shadow until two goal-verified
    fires, then the legacy watchdog idle branch is switched off.
  owner: OP
  trigger:
    condition:
      predicate: { kind: idle-with-open-cell, status: yellow, idle_min: 10 }
      cooldown_min: 10
  goal:
    kind: ledger-line
    path: '{stateRoot}/loops/idle-triage.jsonl'
    contains: '"window":"{window}"'
  failure:
    goal_deadline_min: 5
    max_attempts: 3
    backoff_sec: [60, 120]
  legacy:
    kind: marker
    path: '{seatState}/OP/tools/.graph-cutover/op-idle-triage'
  cutover_after: 2
entry_node: probe
terminal_nodes: [done, failed]
nodes:
  - node_id: probe
    kind: agent
    recipe: 'cmd:trigger-idle-probe'
    max_visits: 1
    input:
      seat: OP
      idle_min: 30
      ledger: '{stateRoot}/loops/idle-triage.jsonl'
      activity:
        - '{seatState}/OP/retro/ELN-OP-RETRO-{date}.md'
        - '{seatState}/OPS/BULLETIN-NOW.md'
  - node_id: wake
    kind: agent
    recipe: 'cmd:trigger-wake'
    max_visits: 1
    input:
      from: OP
      to: OP
      kind: request
      body: '[graph 깨움 · 손 유휴 ⊕ 🟡 칸] 유휴 손이 🟡 칸을 들고 있다(why 의 자리·칸) — 그 손에 칸을 다시 당기게 하거나 재배정. 규칙 11 처방표: 현재 판(plans/ status current) 목표 «시간당 착지 10·초록 10» 기준 병목 하나 골라 손잡이를 직접 당기고 전후 숫자 1줄.'
  - { node_id: done, kind: gate, max_visits: 1 }
  - { node_id: failed, kind: gate, max_visits: 1 }
edges:
  - { from: probe, on: outcome, map: { idle: wake, busy: done, fail: failed, error: failed } }
  - { from: wake, on: outcome, map: { ok: done, fail: failed, error: failed } }
