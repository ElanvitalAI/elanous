graph_id: watchers-check
version: 1
loop:
  title: Watch the watchers
  root: 조율자
  managed_by: trigger-registry
  description: >-
    Every 5 min judge every watcher heartbeat (`eln watch beat`): no beat > 2x cadence = DEAD, repeated errors =
    BROKEN, saw 0 while the source moved past (or below) its cursor = BLIND. One deduped card to CLAUDE-OP per status
    change (hourly repeat while still bad) and a «👁 Watchers» row on `els status-board`. Shadow stage judges only.
    Done-when = watchers/alerts.json rewritten (a failed card post leaves it untouched, so the goal misses and the
    registry cards the owner).
  owner: OP
  trigger:
    cron: '*/5 * * * *'
  goal:
    kind: file-mtime
    path: '{stateRoot}/watchers/alerts.json'
  failure:
    goal_deadline_min: 4
    max_attempts: 2
    backoff_sec: [60]
  cutover_after: 2
entry_node: check
terminal_nodes: [done, failed]
nodes:
  - node_id: check
    kind: agent
    recipe: 'cmd:trigger-watchers-check'
    max_visits: 1
  - { node_id: done, kind: gate, max_visits: 1 }
  - { node_id: failed, kind: gate, max_visits: 1 }
edges:
  - { from: check, on: outcome, map: { ok: done, fail: failed, error: failed } }
