graph_id: seat-stall-watch
loop:
  title: Seat record stall watch
  root: 조율자
  description: Shadow-only scan for seats whose DECISIONS.md gains no new entry for the stall threshold (default 30 minutes); raises one 🔴 OP mail per stall window.
  owner: ABSORB-1
  trigger:
    # Source: TUI-OP-LADDER-SPRINT-1119 #19 — a 10-minute tick detects a 30-minute stall within two ticks.
    cron: '*/10 * * * *'
    events: [manual]
# Known gap: the current scheduled runner has no seat-state provider; `input.seats` is an explicit shadow input until the seat-state projection is wired.
# Source: graphs/ops graph manifest schema uses version 1.
version: 1
entry_node: tick
terminal_nodes: [done, failed]
nodes:
  # Source: existing ops graphs bound the command node to one visit per graph run.
  - { node_id: tick, kind: agent, recipe: 'cmd:seat-stall-watch-shadow', max_visits: 1 }
  # Source: existing ops graphs bind each terminal gate to one visit per graph run.
  - { node_id: done, kind: gate, max_visits: 1 }
  - { node_id: failed, kind: gate, max_visits: 1 }
edges:
  - { from: tick, on: outcome, map: { ok: done, fail: failed, error: failed } }
