graph_id: op-mail-coverage-watch
loop:
  title: OP received-mail judgment coverage watch
  root: 조율자
  description: Shadow-only full scan of a watched seat's received mail (OP 등 · every page); each mail with no matching judgment row gets one «판단 없음: 사유» record and a gap count at the threshold raises one 🔴 OP mail.
  owner: ABSORB-1
  trigger:
    # Source: SHADOW-SEES-ALL-OP-MAIL — a 10-minute tick re-checks the 6-hour coverage window (#19 tick convention).
    cron: '*/10 * * * *'
    events: [manual]
# Known gap: the current scheduled runner has no seat-state provider; `input.seats` is an explicit shadow input until the seat-state projection is wired.
# Source: graphs/ops graph manifest schema uses version 1.
version: 1
entry_node: tick
terminal_nodes: [done, failed]

nodes:
  # Source: existing ops graphs bind the command node to one visit per graph run.
  - { node_id: tick, kind: agent, recipe: 'cmd:op-mail-coverage-watch-shadow', max_visits: 1 }
  # Source: existing ops graphs bind each terminal gate to one visit per graph run.
  - { node_id: done, kind: gate, max_visits: 1 }
  - { node_id: failed, kind: gate, max_visits: 1 }
edges:
  - { from: tick, on: outcome, map: { ok: done, fail: failed, error: failed } }
