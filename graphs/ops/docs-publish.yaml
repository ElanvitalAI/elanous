graph_id: docs-publish
loop:
  title: 문서 게시
  description: 공개 문서를 빌드하고 게시 전 검증한다
  trigger:
    events: [manual]
version: 1
entry_node: build
terminal_nodes: [done, failed]
nodes:
  - node_id: build
    kind: agent
    recipe: cmd:build-public
    max_visits: 1
  - node_id: deploy
    kind: agent
    recipe: cmd:deploy-pages-dry
    max_visits: 1
  - node_id: done
    kind: gate
    max_visits: 1
  - node_id: failed
    kind: gate
    max_visits: 1
edges:
  - from: build
    on: outcome
    map: { ok: deploy, fail: failed }
  - from: deploy
    on: outcome
    map: { ok: done, fail: failed }
