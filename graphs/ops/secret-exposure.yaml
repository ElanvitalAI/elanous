graph_id: secret-exposure
loop:
  title: Secret exposure scan
  description: Daily read-only candidate scan; shadow by default
  trigger:
    cron: '0 4 * * *'
version: 1
entry_node: scan
terminal_nodes: [done, failed]
nodes:
  - node_id: scan
    kind: agent
    recipe: cmd:secret-exposure-scan
    max_visits: 1
  - node_id: done
    kind: gate
    max_visits: 1
  - node_id: failed
    kind: gate
    max_visits: 1
edges:
  - from: scan
    on: outcome
    map: { ok: done, fail: failed }
