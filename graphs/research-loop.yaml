# ⭐ 연구 골 템플릿 — ⛔ 출처는 «오늘 실물로 돈 런»이다(추측 아님).
#   📏 실측(2026-09-08 · 격리 승격 첫 런 run-16dbf868):
#      걸음  investigate → judge → investigate → judge → main-sync → regate → open-pr → merge
#      ⛔ 그중 main-sync·regate 는 이 템플릿이 «선언하지 않은» 노드였다(내 이름 사상이 셋만 덮었다).
#   🔑 그래서 이 판은 그 둘을 «선언한다» — 착지 경로는 implement-loop 과 «같은 기계»를 쓰기 때문이다.
#
# ✅ implement-loop 과의 «진짜» 차이는 하나다: gate 가 «조건부»다(문서만 바뀐 판엔 돌 시험이 없다).
#   대표 확인: 연구 골의 산출은 «문서»이고 문서는 PR 로 착지해야 «남는다» ⇒ merge 를 뺄 수 없다.

graph_id: research-loop
version: 5
journey_stages: [entry, author, dispatch, run, land, recover, end]
entry_node: intake
terminal_nodes: [landed, needs-human]
runner_inputs: [goal, worktree, branch, review-intent, head-sha, base-branch, ask, context, prior]
# ⛔ 키 이름은 파서(`src/self-implement/graph-yaml.ts:201`)가 아는 것뿐이다 — 다른 이름은 «조용히» 무시된다.
docs_only_gate_skip: true

nodes:
  - node_id: investigate
    kind: agent
    recipe: headless-goal-loop
    # 📏 실측 2026-09-08 (원장 30일 · 전 우주 · 걸음 191개 소급): 이 노드의 «관측 최대»가 ***7*** 이었다.
    #   🩸 옛 선언 `4` 는 실물보다 ***3*** 좁았다 — open-pr·merge 와 «같은 계급»의 결함이다.
    #   🪞 1차 소급에서 이것을 «놓쳤다» — 그 걸음들이 신원 버그로 `self-implement` 로 찍혀 있어
    #     「선언에 없는 노드」로 걸러졌다. ***낡은 신원의 행에도 «걸음 자료»는 살아 있다.***
    #   ⛔ 다시 좁히려면 «표본»을 대라.
    max_visits: 7
    progress: [implementing, implemented]
    terminal_stages: [aborted, timed-out]
    contract:
      inputs: [goal, worktree]
      tools: worktree-write
      outputs: [document, summary, changed-files]

  # ⛔ 조건부다 — 라우터(`routeGate`)가 «코드»로 판정한다. LLM 이 못 고른다(RFC §4.3 ⑵).
  - node_id: gate
    kind: gate
    recipe: gate-baseline
    # 📏 실측 2026-09-08(걸음 191 소급): 이 노드의 «관측 최대»가 6 였다 — 옛 선언 4 은 좁았다.
    #   🪞 앞선 판(#16220)이 implement-loop·default-loop «둘만» 고치고 ***이 파일을 빠뜨렸다*** —
    #     그 전수 실패를 `test/graph-budget-matches-observation.test.ts` 가 잡았다.
    max_visits: 6
    progress: [gating, gated]
    terminal_stages: []
    contract:
      inputs: [worktree, changed-files]
      tools: read-and-run-tests
      outputs: [passed, log]

  - node_id: judge
    kind: judge
    recipe: pr-reviewer
    max_visits: 4
    progress: [reviewing, reviewed]
    terminal_stages: [review-blocked]
    contract:
      inputs: [document, review-intent]
      tools: read-only
      outputs: [verdict, must-fix, review-summary]

  # 📏 아래 둘은 «실측이 요구했다» — 오늘 첫 런이 실제로 밟았다.
  - node_id: main-sync
    kind: git
    recipe: seams-git-merge-main
    max_visits: 2
    progress: [gating, merge-conflict]
    terminal_stages: [merge-conflict]
    contract:
      inputs: [worktree, base-branch]
      tools: git-write
      outputs: [synced, conflicts]

  - node_id: regate
    kind: gate
    recipe: gate-baseline
    max_visits: 2
    progress: [gating]
    terminal_stages: [gate-failed]
    contract:
      inputs: [worktree]
      tools: read-and-run-tests
      outputs: [passed, log]

  - node_id: open-pr
    kind: git
    recipe: seams-gh-open-pr
    # 📏 실측 2026-09-08(걸음 191 소급): 이 노드의 «관측 최대»가 2 였다 — 옛 선언 1 은 좁았다.
    #   🪞 앞선 판(#16220)이 implement-loop·default-loop «둘만» 고치고 ***이 파일을 빠뜨렸다*** —
    #     그 전수 실패를 `test/graph-budget-matches-observation.test.ts` 가 잡았다.
    max_visits: 2
    progress: [pr-opening, pr-opened]
    terminal_stages: [pr-declined, pr-opened]
    contract:
      inputs: [branch, review-summary]
      tools: gh-pr-create
      outputs: [pr-number, pr-url]

  - node_id: merge
    kind: git
    recipe: seams-gh-merge-squash
    # 📏 실측 2026-09-08(걸음 191 소급): 이 노드의 «관측 최대»가 2 였다 — 옛 선언 1 은 좁았다.
    #   🪞 앞선 판(#16220)이 implement-loop·default-loop «둘만» 고치고 ***이 파일을 빠뜨렸다*** —
    #     그 전수 실패를 `test/graph-budget-matches-observation.test.ts` 가 잡았다.
    max_visits: 2
    progress: [merging, merged]
    terminal_stages: [merged, pr-opened, merge-ready]  # merge-ready = Pod 런이 호스트 재게이트에 넘긴 자리(#20988)
    contract:
      inputs: [pr-number, head-sha]
      tools: gh-pr-merge
      outputs: [merged]

  # Only a PR landing refusal supplies the pinned context required by recover@1.
  - node_id: recover
    kind: subgraph
    recipe: none
    max_visits: 1
    call: recover@1
    budget: { inner_steps: 4 }
    contract: { inputs: [ask, context, prior], tools: read-only, outputs: [result, evidence] }

  - { node_id: landed, kind: gate, recipe: none, max_visits: 1 }
  - { node_id: needs-human, kind: gate, recipe: none, max_visits: 1 }

  # Entry and Pod dispatch reuse the existing ARG-UNIT-LIB units.
  - node_id: intake
    kind: observe
    recipe: harness-entrance
    journey_stage: entry
    max_visits: 1
    contract: { inputs: [ask, context, prior], tools: read-only, outputs: [route, reason] }
  - node_id: queue
    kind: gate
    recipe: harness-queue
    journey_stage: entry
    max_visits: 1
    contract: { inputs: [goal], tools: read-only, outputs: [queue_status, card_id] }
  - node_id: launch-gate
    kind: gate
    recipe: pre-launch-gate
    journey_stage: entry
    max_visits: 1
    contract: { inputs: [goal], tools: read-only, outputs: [decision, reason] }
  - node_id: entry-unit
    kind: subgraph
    recipe: none
    journey_stage: entry
    max_visits: 1
    call: entry@1
    budget: { inner_steps: 4 }
    contract: { inputs: [ask, context, prior], tools: read-only, outputs: [result, evidence] }
  - node_id: dispatch
    kind: judge
    recipe: harness-substrate-select
    journey_stage: dispatch
    max_visits: 2
    contract: { inputs: [launch_decision], tools: read-only, outputs: [substrate] }
  - node_id: pool-admit
    kind: gate
    recipe: pod-pool-admission
    journey_stage: dispatch
    max_visits: 4
    contract: { inputs: [goal, substrate], tools: read-only, outputs: [admission, reason] }
  - node_id: dispatch-pod-unit
    kind: subgraph
    recipe: none
    journey_stage: dispatch
    max_visits: 4
    call: dispatch-pod@1
    budget: { inner_steps: 4 }
    contract: { inputs: [ask, context, prior], tools: worktree-write, outputs: [result, evidence] }
  - node_id: freeze-check
    kind: gate
    recipe: landing-freeze-admission
    journey_stage: land
    max_visits: 4
    contract: { inputs: [worktree, changed-files], tools: read-and-run-tests, outputs: [decision, reason] }
  - node_id: hold
    kind: hitl
    recipe: frozen-merge-queue
    journey_stage: land
    max_visits: 4
    contract: { inputs: [pr-number, freeze-state], tools: human-selection, outputs: [decision] }
  - node_id: cleanup
    kind: git
    recipe: post-merge-cleanup
    journey_stage: land
    max_visits: 1
    contract: { inputs: [pr-number, merge-sha, worktree], tools: git-write, outputs: [cleaned, worktree] }
  - node_id: result-parse
    kind: observe
    recipe: pod-failure-reason
    journey_stage: recover
    max_visits: 4
    contract: { inputs: [failure-log], tools: read-only, outputs: [failure-class, evidence] }
  - node_id: salvage
    kind: git
    recipe: salvage-branch
    journey_stage: recover
    max_visits: 4
    contract: { inputs: [worktree, branch], tools: git-write, outputs: [salvage-branch, ref] }
  - node_id: heal
    kind: judge
    recipe: heal-intake
    journey_stage: recover
    max_visits: 4
    contract: { inputs: [failure-class, evidence], tools: read-only, outputs: [repair-plan, reason] }
  - node_id: next-move
    kind: judge
    recipe: task-agent-judge
    journey_stage: recover
    max_visits: 4
    contract: { inputs: [repair-results, card-state], tools: read-only, outputs: [next-action, reason] }
  - node_id: ready
    kind: gate
    recipe: none
    journey_stage: land
    max_visits: 1
    contract: { inputs: [pr-number, head-sha], tools: read-only, outputs: [ready, reason] }
  - node_id: pr-head-checkout
    kind: gate
    recipe: none
    journey_stage: land
    max_visits: 1
    contract: { inputs: [pr-number, worktree], tools: git-write, outputs: [checked-out-head, worktree] }

edges:
  - { from: intake, on: outcome, map: { queued: queue, direct: launch-gate, ok: launch-gate, fail: needs-human } }
  - { from: queue, on: outcome, map: { launched: launch-gate, waiting: needs-human, refused: needs-human, ok: launch-gate, fail: needs-human } }
  - { from: launch-gate, on: outcome, map: { pass: entry-unit, refuse: needs-human, ok: entry-unit, fail: needs-human } }
  - from: entry-unit
    on: outcome
    map: { done: dispatch, rework: investigate, needs-human: needs-human, failed: needs-human }
  - from: dispatch
    on: outcome
    map: { local: investigate, pod: pool-admit, fresh: investigate, pr-source: pool-admit, ok: investigate, fail: needs-human }
  - { from: pool-admit, on: outcome, map: { admitted: dispatch-pod-unit, refused: needs-human, ok: dispatch-pod-unit, fail: needs-human } }
  - from: dispatch-pod-unit
    on: outcome
    map: { done: investigate, rework: investigate, needs-human: needs-human, failed: result-parse }
  # ⛔⭐ 유일하게 implement-loop 과 «다른» 자리 — gate 를 «건너뛸 수 있다».
  #   조건은 코드가 낸다: 변경 파일에 «코드»가 있나(routeGate). 못 세면 «돈다»(fail-safe).
  - from: investigate
    on: changed-files
    map:
      code-changed: gate               # 코드가 섞였다 ⇒ 시험을 돌린다
      documents-only: judge            # 문서만 ⇒ 돌 시험이 없다
      unknown: gate                    # ⛔ 「모른다」를 「없다」로 안 읽는다 — fail-safe
    observed: 3                        # 📏 2026-09-08 첫 런(전부 documents-only)

  - from: gate
    on: outcome
    map:
      pass: judge
      fail: investigate

  - from: judge
    on: outcome
    map:
      fail: investigate                # 📏 관측 2
      pass: main-sync                  # 📏 관측 1
    fallback:
      - node: open-pr
        requires: []
        observed: 0

  - from: main-sync
    on: outcome
    map:
      pass: regate
    fallback:
      - node: open-pr
        requires: []
        observed: 0

  - from: regate
    to: open-pr

  - from: open-pr
    to: freeze-check
  - from: freeze-check
    on: outcome
    map: { open: merge, frozen: hold, taken: needs-human, ok: merge, fail: needs-human }
  - from: hold
    to: freeze-check

  - from: merge
    on: outcome
    map: { merged: cleanup, land-refused: recover, draft: ready, head-branch: pr-head-checkout, not-ancestor: main-sync, review-missing: judge, other: next-move, ok: needs-human, fail: needs-human }
  - from: cleanup
    to: landed
  - from: result-parse
    to: salvage
  - from: salvage
    to: heal
  - from: heal
    to: next-move
  - { from: ready, to: next-move }
  - { from: pr-head-checkout, to: next-move }
  - from: next-move
    on: outcome
    map: { narrow-relaunch: dispatch, salvage-relaunch: dispatch, alternative: dispatch, wait-retry: dispatch, decision-card: needs-human, wait: needs-human, ok: needs-human, fail: needs-human }

  # The train/TA owns retry effects; the unit only classifies the refusal.
  - from: recover
    on: outcome
    map: { done: needs-human, rework: needs-human, needs-human: needs-human, failed: needs-human }
