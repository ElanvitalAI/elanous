apiVersion: elanous.dev/loop/v1
id: 'loop:rla@1'
card:
  title: Release Loop Agent
  supervises: [release-loop]
  role: primary
  extensions: [elanous.dev/arg]
triggers:
  events: [gate.verdict, release.incident, run.failed]
# Source: RLA ARG RFC §2d — proposal authority only; D2/D3 actions require their separate board/human decisions.
authority: [reroute, add-node, repair, hitl, skip-node, gate-waiver, regression-response, emergency-release]
policy:
  scope: run
  proposal: validate-before-apply
  verificationFailure: rollback
  approval: { resultType: input_required, requestState: required }
  openProposal:
    vocabularyNamespace: release.gate.failure
    lowRiskKinds: [vocabulary]
    highRiskKinds: [node, edge, condition, external-action]
    candidateStore: instance
    injectCandidateMemory: false
    autoPromote: false
    templatePromotion: [declaration, verification, mrtr-approval]
knowledgePacks: [../release-edge-vocabulary.yaml, ../macrophage-subscriber.yaml]
templateMemory: { graph: ../release-loop.yaml, ledger: graph-supervisors/actions.jsonl }
prompt:
  role: release-supervisor
  instruction: Observe the failed gate; propose a bounded retry edge, validate it, verify the result, and roll back on failure.
  llm: { role: supervisor-planner, optional: true }
graph: ./supervisor.yaml
