# Inputs gateRemote (SSH host, e.g. node-b) and gateRemoteMirror (bare mirror path, default ~/mirror/elanous-agent.git): run gate sweeps in temporary remote clones without a matching caller checkout; omit gateRemote for local execution.
# Optional opsHosts: ['local', '<ssh-host>']; omit for no operational upgrades. Optional internalDist publishes the release checkout to the internal feed first; opsRestart: true explicitly allows daemon restarts.
graph_id: release-loop
loop:
  title: 릴리스
  description: 승인된 판을 빌드·검증·게시한다
  trigger:
    events: [manual]
version: 1
entry_node: version-release
dry_run_await_approval: true
terminal_nodes: [done, failed]
nodes:
  - { node_id: version-release, kind: git, recipe: 'cmd:version-release', max_visits: 1 }
  - { node_id: cutoff, kind: judge, recipe: 'cmd:cutoff', max_visits: 1 }
  - { node_id: checklist-gate, kind: gate, recipe: 'cmd:checklist-gate', max_visits: 1 }
  - { node_id: gate, kind: gate, recipe: 'cmd:gate', max_visits: 1, notify: start }
  - { node_id: pwa, kind: gate, recipe: 'cmd:pwa', max_visits: 1, notify: start }
  - { node_id: prepare, kind: agent, recipe: 'cmd:prepare', max_visits: 1, notify: start }
  - { node_id: upgrade, kind: gate, recipe: 'cmd:upgrade', max_visits: 1 }
  - { node_id: tui, kind: gate, recipe: 'cmd:tui', max_visits: 1 }
  - { node_id: docs, kind: agent, recipe: 'cmd:docs', max_visits: 1 }
  - { node_id: known-issues, kind: agent, recipe: 'cmd:known-issues', max_visits: 1 }
  - { node_id: notes-check, kind: gate, recipe: 'cmd:notes-check', max_visits: 1 }
  - { node_id: auto-approve, kind: gate, recipe: 'cmd:auto-approve', max_visits: 1 }
  - { node_id: approve-publish, kind: hitl, recipe: 'approval:publish', max_visits: 1 }
  - { node_id: publish, kind: git, recipe: 'cmd:publish-command', max_visits: 1 }
  - { node_id: npm-publish, kind: git, recipe: 'cmd:npm-publish', max_visits: 1 }
  - { node_id: docs-land, kind: git, recipe: 'cmd:docs-land', max_visits: 1 }
  - { node_id: verify, kind: gate, recipe: 'cmd:verify', max_visits: 1 }
  - { node_id: ops-upgrade, kind: agent, recipe: 'cmd:ops-upgrade', max_visits: 1 }
  - { node_id: version-dev-bump, kind: git, recipe: 'cmd:version-dev-bump', max_visits: 1 }
  - { node_id: done, kind: gate, max_visits: 1 }
  - { node_id: failed, kind: gate, max_visits: 1 }
edges:
  - { from: version-release, on: outcome, map: { ok: cutoff, fail: failed, error: failed } }
  - { from: cutoff, on: outcome, map: { ok: checklist-gate, fail: failed, error: failed } }
  - { from: checklist-gate, on: outcome, map: { ok: gate, fail: failed, error: failed } }
  - { from: gate, on: outcome, map: { ok: pwa, fail: failed, error: failed } }
  - { from: pwa, on: outcome, map: { ok: prepare, fail: failed, error: failed } }
  - { from: prepare, on: outcome, map: { ok: upgrade, fail: failed, error: failed } }
  - { from: upgrade, on: outcome, map: { ok: tui, fail: failed, error: failed } }
  - { from: tui, on: outcome, map: { ok: docs, fail: failed, error: failed } }
  - { from: docs, on: outcome, map: { ok: known-issues, fail: failed, error: failed } }
  - { from: known-issues, on: outcome, map: { ok: notes-check, fail: failed, error: failed } }
  - { from: notes-check, on: outcome, map: { ok: auto-approve, fail: failed, error: failed } }
  - { from: auto-approve, on: outcome, map: { ok: publish, fail: approve-publish, error: approve-publish } }
  - { from: approve-publish, on: outcome, map: { ok: publish, fail: failed } }
  - { from: publish, on: outcome, map: { ok: npm-publish, fail: failed, error: failed } }
  - { from: npm-publish, on: outcome, map: { ok: docs-land, fail: docs-land, error: docs-land } }
  - { from: docs-land, on: outcome, map: { ok: verify, fail: failed, error: failed } }
  - { from: verify, on: outcome, map: { ok: ops-upgrade, fail: failed, error: failed } }
  - { from: ops-upgrade, on: outcome, map: { ok: version-dev-bump, fail: version-dev-bump, error: version-dev-bump } }
  - { from: version-dev-bump, on: outcome, map: { ok: done, fail: failed, error: failed } }
