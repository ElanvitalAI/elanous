# 2판(MAKE-CODE-UNIT-THIN): tasks hand 가 이 조합을 실제 graph run(runGraph)으로 발사한다.
# make-code@1(graphs/units/verbs/make-code.yaml)은 노드 하나 = 네이티브 harness say 인 얇은 감싸기다.
# 단위가 없거나 판이 다르면 발사 전 거부한다(composition-launcher-unavailable) — harness say 로 조용히 새지 않는다.
graph_id: work-code-pr
version: 2
launcher: graph-run
entry_node: make-code
terminal_nodes: [done, needs-human, failed]
nodes:
  - node_id: make-code
    kind: subgraph
    recipe: none
    max_visits: 1
    call: make-code@1
    covers: [research, decide, make, verify, execute]
    budget: { inner_steps: 20 }
    contract: { inputs: [ask, context, prior], tools: harness-say, outputs: [result, evidence] }
  - { node_id: done, kind: gate, recipe: none, max_visits: 1 }
  - { node_id: needs-human, kind: gate, recipe: none, max_visits: 1 }
  - { node_id: failed, kind: gate, recipe: none, max_visits: 1 }
edges:
  - from: make-code
    on: outcome
    map: { launched: done, needs-human: needs-human, failed: failed }
