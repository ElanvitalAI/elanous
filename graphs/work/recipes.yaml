# work-research-report-rehearsal has no command nodes; its behavior is in called graph units.
draft-close-decide:
  command: 'bun scripts/graph-units/draft-close-node.ts decide'
  dry_run_command: 'bun scripts/graph-units/draft-close-node.ts decide'
  timeout_ms: 10000
draft-close-emit-harvest:
  command: 'bun scripts/graph-units/draft-close-node.ts emit harvest'
  dry_run_command: 'bun scripts/graph-units/draft-close-node.ts emit harvest'
  timeout_ms: 10000
draft-close-emit-close-candidate:
  command: 'bun scripts/graph-units/draft-close-node.ts emit close-candidate'
  dry_run_command: 'bun scripts/graph-units/draft-close-node.ts emit close-candidate'
  timeout_ms: 10000
draft-close-emit-hold:
  command: 'bun scripts/graph-units/draft-close-node.ts emit hold'
  dry_run_command: 'bun scripts/graph-units/draft-close-node.ts emit hold'
  timeout_ms: 10000
e1:
  command: >-
    bun -e 'const c=await Bun.file(process.env.ELANOUS_GRAPH_CONTEXT).json(); const i=c.input??{}; const emit=x=>console.log(JSON.stringify(x)); const repo=process.env.ELANOUS_GRAPH_DIR+"/../.."; const run=(a)=>Bun.spawnSync(["git","-C",repo,...a],{stdout:"pipe",stderr:"pipe"}); const paths=Array.isArray(i.paths)?i.paths.filter(x=>typeof x==="string"&&!x.startsWith("/")&&!x.split("/").includes("..")):[]; if(i.main?.ref!=="origin/main"||!i.main?.sha||!Array.isArray(i.candidates)||i.candidates.length!==1||!paths.length){emit({outcome:"hold",reason:"main-candidate-or-scope-required",evidence:["E1 requires origin/main, one candidate, and declared relative scope paths"]});process.exit(0)} const head=run(["rev-parse","HEAD"]), ref=run(["rev-parse","--verify","origin/main"]), branch=run(["branch","--show-current"]), dirty=run(["status","--porcelain"]); if(head.exitCode!==0||ref.exitCode!==0||branch.exitCode!==0||dirty.exitCode!==0){emit({outcome:"hold",reason:"main-check-unreadable",evidence:["E1 could not verify checkout, branch, or worktree"]});process.exit(0)} const mainSha=ref.stdout.toString().trim(), checkoutSha=head.stdout.toString().trim(), branchName=branch.stdout.toString().trim(); if(mainSha!==i.main.sha||checkoutSha!==i.main.sha||branchName!=="main"||dirty.stdout.toString().trim()){emit({outcome:"hold",reason:"main-checkout-not-clean",branch:branchName,head:checkoutSha,evidence:["E1 requires clean main at supplied origin/main SHA"]});process.exit(0)} const candidate=i.candidates[0]; if(!Number.isSafeInteger(candidate.pr)||candidate.pr<1){emit({outcome:"hold",reason:"candidate-pr-missing",evidence:["E1 candidate has no valid PR number"]});process.exit(0)} const p=Bun.spawnSync(["gh","pr","view",String(candidate.pr),"--json","state,mergeCommit"],{cwd:repo,stdout:"pipe",stderr:"pipe"}); if(p.exitCode!==0){emit({outcome:"hold",reason:"pr-unreadable",pr:candidate.pr,evidence:["E1 gh pr view failed rc="+p.exitCode+" · "+p.stderr.toString().trim().slice(-300)]});process.exit(0)} let pr; try{pr=JSON.parse(p.stdout.toString())}catch{emit({outcome:"hold",reason:"pr-json-invalid",pr:candidate.pr,evidence:["E1 PR response was not JSON"]});process.exit(0)} if(pr.state!=="MERGED"){emit({outcome:"fail",reason:"pr-not-merged",pr:candidate.pr,evidence:["E1 PR state="+String(pr.state)]});process.exit(0)} const mergeSha=pr.mergeCommit?.oid; if(!/^[a-f0-9]{40}$/i.test(mergeSha??"")){emit({outcome:"hold",reason:"merge-sha-missing",pr:candidate.pr,evidence:["E1 merged PR has no full merge SHA"]});process.exit(0)} if(candidate.mergeSha&&candidate.mergeSha!==mergeSha){emit({outcome:"hold",reason:"candidate-merge-sha-mismatch",pr:candidate.pr,mergeSha,evidence:["E1 supplied merge SHA differs from GitHub"]});process.exit(0)} const ancestry=run(["merge-base","--is-ancestor",mergeSha,"origin/main"]); if(ancestry.exitCode!==0){emit({outcome:ancestry.exitCode===1?"fail":"hold",reason:ancestry.exitCode===1?"merge-not-in-main":"ancestry-unreadable",pr:candidate.pr,mergeSha,evidence:["E1 git merge-base --is-ancestor rc="+ancestry.exitCode]});process.exit(0)} const diff=run(["diff","--name-only",mergeSha+"^",mergeSha,"--",...paths]); if(diff.exitCode!==0){emit({outcome:"hold",reason:"scope-diff-unreadable",pr:candidate.pr,mergeSha,evidence:["E1 candidate scope diff could not be read"]});process.exit(0)} const changed=diff.stdout.toString().trim().split(/\r?\n/).filter(Boolean), scopePaths=paths.filter(x=>changed.includes(x)); if(!scopePaths.length){emit({outcome:"hold",reason:"scope-not-proven",pr:candidate.pr,mergeSha,evidence:["E1 merge diff does not touch declared cell paths"]});process.exit(0)} emit({outcome:"pass",pr:candidate.pr,mergeSha,branch:branchName,head:checkoutSha,scopePaths,evidence:["E1 merged PR is in origin/main and its merge diff covers declared cell scope"]});'
  timeout_ms: 30000
e2:
  command: >-
    bun -e 'const c=await Bun.file(process.env.ELANOUS_GRAPH_CONTEXT).json(); const i=c.input??{}; const emit=x=>console.log(JSON.stringify(x)); const repo=process.env.ELANOUS_GRAPH_DIR+"/../.."; const prior=c.outputs?.e1; if(prior?.outcome!=="pass"){emit({outcome:"hold",reason:"e1-not-passed",evidence:["E2 refused because E1 did not pass"]});process.exit(0)} const text=[i.title,i.evidence].filter(x=>typeof x==="string").join("\n"); const match=text.match(/완료 경계 증거 명령\s*:\s*([^\r\n]+)/); if(!match){emit({outcome:"hold",reason:"command-missing",evidence:["E2 no exact completion command in title/evidence"]});process.exit(0)} const command=match[1].trim(); const {parseGreenCloseEvidenceCommand,runGreenCloseEvidenceTest}=await import(repo+"/src/task-agent/green-close-recipe.ts"); const parsed=parseGreenCloseEvidenceCommand(command); if(!parsed.ok){emit({outcome:"hold",reason:"e2-command-not-allowed",command,evidence:["E2 accepts only bun test with repository-relative test paths and optional -t/--timeout; shell syntax and other commands are rejected"]});process.exit(0)} const sha=Bun.spawnSync(["git","-C",repo,"rev-parse","HEAD"],{stdout:"pipe",stderr:"pipe"}); if(sha.exitCode!==0||sha.stdout.toString().trim()!==i.main?.sha){emit({outcome:"hold",reason:"main-checkout-mismatch",command,evidence:["E2 checkout is not the supplied main SHA"]});process.exit(0)} let result; try{result=runGreenCloseEvidenceTest(repo,i.main.sha,parsed.args)}catch(error){emit({outcome:"hold",reason:"e2-readonly-worktree-failed",command,evidence:["E2 could not create or run the read-only test worktree: "+String(error).slice(-400)]});process.exit(0)} const measured=result.reason==="completion-command-passed"||result.reason==="completion-command-failed"; emit({outcome:!measured?"hold":result.exitCode===0?"pass":"fail",reason:result.reason,command,exitCode:result.exitCode,stdout:result.stdout,stderr:result.stderr,evidence:["E2 executed argv [bun,test,...] in a detached read-only worktree at "+i.main.sha+"; rc="+String(result.exitCode)]});'

  timeout_ms: 930000
e3:
  command: >-
    bun -e 'const c=await Bun.file(process.env.ELANOUS_GRAPH_CONTEXT).json(); const i=c.input??{}; const emit=x=>console.log(JSON.stringify(x)); const repo=process.env.ELANOUS_GRAPH_DIR+"/../.."; const e2=c.outputs?.e2; if(e2?.outcome!=="pass"){emit({outcome:"hold",verdict:"unmeasured",reason:"e2-not-passed",evidence:["E3 refused because E2 did not pass"]});process.exit(0)} const paths=Array.isArray(i.paths)?i.paths.filter(x=>typeof x==="string"):[]; const tests=paths.filter(x=>/\.test\.[cm]?[jt]sx?$/.test(x)); const production=paths.filter(x=>/\.[cm]?[jt]sx?$/.test(x)&&! /\.test\.[cm]?[jt]sx?$/.test(x)); if(!tests.length||!production.length){emit({outcome:"missing",verdict:"missing",reason:"test-or-production-path-missing",evidence:["E3 needs declared production and test paths"]});process.exit(0)} const {parseGreenCloseEvidenceCommand,analyzeProductionAssertion}=await import(repo+"/src/task-agent/green-close-recipe.ts"); const parsed=parseGreenCloseEvidenceCommand(String(e2.command??"")); if(!parsed.ok){emit({outcome:"hold",verdict:"unmeasured",reason:"e2-command-not-allowed",evidence:["E3 cannot consume an unapproved E2 command"]});process.exit(0)} const tsTestPaths=tests.filter(testPath=>parsed.args.includes(testPath)); let sawCall=false; for(const testPath of tsTestPaths){let source; try{source=await Bun.file(new URL(testPath,"file://"+repo+"/")).text()}catch{continue} const result=analyzeProductionAssertion(source,testPath,production.map(p=>new URL(p,"file://"+repo+"/").pathname)); sawCall ||= result.called; if(result.asserted){emit({outcome:"pass",verdict:"pass",reason:"test-asserts-imported-production-result",testPath,productionPaths:production,evidence:["E3 same test/it block imports a declared production entry, calls it, and asserts its result or a simple value alias"]});process.exit(0)}} if(sawCall){emit({outcome:"hold",verdict:"unmeasured",reason:"e3-no-assertion",evidence:["E3 found a production call in the commanded test file, but no assertion in that same test/it block consumes its result"]});process.exit(0)} emit({outcome:"missing",verdict:"missing",reason:"no-asserted-production-call",evidence:["E3 no commanded test block asserted a call to an import from a declared production path"]});'

  timeout_ms: 30000
produce:
  command: >-
    bun -e 'const c=await Bun.file(process.env.ELANOUS_GRAPH_CONTEXT).json(); const i=c.input??{}; const repo=process.env.ELANOUS_GRAPH_DIR+"/../.."; const context=process.env.ELANOUS_GRAPH_CONTEXT??"", marker=context.lastIndexOf("/graph-runs/"); const root=marker>=0?context.slice(0,marker):""; const {produceBoundaryProof}=await import(repo+"/src/task-agent/boundary-proof-producer.ts"); console.log(JSON.stringify(produceBoundaryProof({title:String(i.title??""),cellId:String(i.cellId??""),mainSha:String(i.main?.sha??""),mapRunId:String(i.mapRunId??""),cardId:String(i.cardId??""),graphRunId:String(c.runId??""),stateRoot:root,repoRoot:repo})));'
  timeout_ms: 930000
boundary:
  command: >-
    bun -e 'const c=await Bun.file(process.env.ELANOUS_GRAPH_CONTEXT).json(); const i=c.input??{}; const e1=c.outputs?.e1??{}, e2=c.outputs?.e2??{}, produced=c.outputs?.produce??{}; const repo=process.env.ELANOUS_GRAPH_DIR+"/../.."; const {verifyGreenCloseBoundary}=await import(repo+"/src/task-agent/green-close-recipe.ts"); const context=process.env.ELANOUS_GRAPH_CONTEXT??"", marker=context.lastIndexOf("/graph-runs/"); const root=marker>=0?context.slice(0,marker):""; console.log(JSON.stringify(verifyGreenCloseBoundary({title:String(i.title??""),evidence:String(i.evidence??""),paths:Array.isArray(i.paths)?i.paths:[],changedPaths:Array.isArray(e1.scopePaths)?e1.scopePaths:[],cellId:String(i.cellId??""),mainSha:String(i.main?.sha??""),stateRoot:root,repoRoot:repo,command:String(e2.command??""),mapRunId:String(i.mapRunId??""),cardId:String(i.cardId??""),graphRunId:String(c.runId??""),proofRef:String(produced.proofRef??"")})));'
  timeout_ms: 30000
make-test:
  command: >-
    bun -e 'const c=await Bun.file(process.env.ELANOUS_GRAPH_CONTEXT).json(); const i=c.input??{}; const e3=c.outputs?.e3??{}; const row={outcome:"mock-pr",kind:"mock-pr",cellId:i.cellId,version:i.version,reason:e3.reason??"production-entry-unproven",mockScenarioId:"MS-05",mockRequest:{state:"requested",prCreated:false,productionPaths:(i.paths??[]).filter(x=>typeof x==="string"&&!/\.test\.[cm]?[jt]sx?$/.test(x)),testPaths:(i.paths??[]).filter(x=>typeof x==="string"&&/\.test\.[cm]?[jt]sx?$/.test(x)),e3:e3.evidence??[]},evidence:["E3 is unproved; request an MS-05 production-entry mock test. No PR or checklist write is performed."]}; console.log(JSON.stringify(row));'
  timeout_ms: 30000
result:
  command: >-
    bun -e 'const c=await Bun.file(process.env.ELANOUS_GRAPH_CONTEXT).json(); const i=c.input??{}; const o=c.outputs??{}; const e1=o.e1??{}, e2=o.e2??{}, e3=o.e3??{}, produce=o.produce??{}, boundary=o.boundary??{}, mock=o["make-test"]??{}; let kind="hold", reason=e1.reason??"e1-unmeasured"; if(e1.outcome==="pass"){reason=e2.reason??"e2-unmeasured"; if(e2.outcome==="fail")kind="implementation-remains"; else if(e2.outcome==="pass"){reason=e3.reason??"e3-unmeasured"; if(e3.outcome==="pass"){reason=produce.reason??"boundary-unproven"; if(produce.outcome==="pass"){reason=boundary.reason??"boundary-unproven"; if(boundary.outcome==="pass")kind="green-candidate"}} else if(e3.outcome==="missing"&&mock.outcome==="mock-pr"){kind="mock-pr";reason=mock.reason}}} const row={outcome:"ok",cellId:i.cellId,version:i.version,kind,reason,...(e1.pr?{pr:e1.pr}:{}),...(e1.mergeSha?{mergeSha:e1.mergeSha}:{}),...(e2.command?{command:e2.command}:{}),...(Number.isSafeInteger(e2.exitCode)?{exitCode:e2.exitCode}:{}),...(e3.verdict?{e3:{verdict:e3.verdict,reason:e3.reason,testPath:e3.testPath,productionPaths:e3.productionPaths}}:{}),...(mock.mockScenarioId?{mockScenarioId:mock.mockScenarioId,mockRequest:mock.mockRequest}:{}),evidence:[...(e1.evidence??[]),...(e2.evidence??[]),...(e3.evidence??[]),...(produce.evidence??[]),...(boundary.evidence??[]),...(mock.evidence??[])]}; console.log(JSON.stringify(row));'
  timeout_ms: 30000
