# 🧩 엘라누스 그래프 «노드 카탈로그» — 역할 원형 ← 이미 있는 판단·실행·관측 부품
#
# 대표 2026-09-26: 판단 노드·실행 노드를 기존에 가진 것에서 많이 반영해 풍부한 그래프로 · 그래뉼리티가 안 맞으면 새 노드 타입을 만들어도 된다.
# 📄 설계 = 내부 문서 `RFC-the-heal-loop-is-a-graph-that-raises-its-own-resolution-2026-09-26` §7
#
# ⭐ 읽는 법
#   role        그래프 노드가 가리키는 «역할» 이름. 표준 템플릿·성형(launch/runtime)·힐·워크플로우·태스크가 «같은» 이름을 쓴다.
#   kind        실행 권한 등급. agent·gate·git·judge·observe·hitl·subgraph (§7.2).
#   grain       atom(한 번의 호출) · composite(몇 분짜리 루프·여러 호출) · subgraph(그래프 한 판).
#   outcomes    이 노드가 낼 수 있는 결과 — 간선 `on: outcome` 의 map 키가 된다.
#   effects     none · worktree-write · git · network · spawn · pause · ui(웹·화면 조작)
#   spawn       슈퍼바이저가 얹을 수 있는 단계: runtime(실행 중에도) · launch(최초 판단 때만) · never(표준 템플릿에서만)
#   body        대표 몸(지금 코드의 진입 함수 · 파일:줄은 2026-09-26 HEAD abefd5e374 실측 — ⛔ 늙는다, 이름으로 다시 찾아라)
#   alternates  같은 역할을 하는 다른 구현(중복) — 통합 후보. 카탈로그는 «대표 하나»를 고른다.
#   names       템플릿마다 다른 노드 이름(같은 역할) — W2 에서 이 표로 맞춘다.
#
# ⛔ 이 디렉터리는 graphs/ «하위»라 하니스 템플릿 적재기(graph-yaml.ts loadGraphTemplates — 최상위만 읽는다)가 싣지 않는다.
# ⛔ 슈퍼바이저는 여기 없는 역할을 만들지 못한다(RFC §3.4 · 그래프 엔지니어링 RFC §7 좁힘).

