# 착지 집사 (land-steward) — goal card (LOOP-AGENT §1 ① 목표). Read by src/land-steward/cards.ts.
# «틱 완료 ≠ 목표 완료»: the tick rewrites last-tick.json; the goal is closed only by these outcome numbers.
id: land-steward
address: LAND-STEWARD          # voice: els channel loop:land-steward (eln land steward voice) · eln land steward ask
rank: sub-coordinator          # OP 직속 · TC·JUD·UX·MK 와 동급
supervisor: TC                 # L0: landing duty (org duty «landing») · veto stays JUD · policy → OP · money/irreversible → 대표
body: land-graph               # src/land-graph/* — eln land graph plan|tick|status (one trigger: graphs/triggers/land-graph.yaml)
kpi:
  lands_per_hour_min: 10                 # 대표 시간당 착지 10
  landable_ratio_min: 0.5                # ready ÷ open non-draft PRs the body judged this tick
  needs_finisher_wait_p50_max_min: 30    # finisher jobs / needs-finisher cards on current heads
  refusals_without_next_max: 0           # every non-land decision names who acts next
subagents:
  - id: train-manager          # 기차 매니저 — slot allocation · hot-file serialization · batch order (src/land-steward/train.ts)
    knowhow: knowhow.md        # reattached from seat-state/OP/LANDING-KNOWHOW.md (merge-train era)
  - id: finisher               # 마무리꾼 — receipt / refresh / retarget / tsc-timeout retry / stale reap 24h (src/land-graph/finisher.ts)
  - id: cell-link              # 칸 연결 — PR → cell of the release in play (src/land-graph/cell-link.ts)
    policy: cell-auto.yaml     # CELLLESS-PR-AUTO-CELL — a cellless merge gets an auto-registered cell (src/land-graph/auto-cell.ts)
never_auto:
  - security-4 paths           # Terra PASS/WARN on the head (policy exception — mail stays)
  - JUD veto                   # holds are JUD's
  - force push / closing PRs that are not provably superseded
report:
  breach_line_every_min: 30    # one line in its own channel on KPI breach · no mail to OP (signal diet)
