# 대식세포 (macrophage) — LOOP-AGENT v3 YAML definition (YAML-SUPERVISORS-DEF · 대표 11-27 12:0x «감독자들도 다 로직·정책 등을 yaml 로»).
# Schema: src/loop-agent/v3/agent-yaml.ts · executor: src/loop-agent/v3/supervisor.ts · lint: eln loop agent lint macrophage
# Tiers: ① rules / thresholds / routing = this file (policies · body edges) · ② deterministic logic = the node kinds it requires
# (provides.nodes · their tests and the supervisors sim world are the spec) · ③ fuzzy judgment = the voice block (one LLM turn when spoken to · role router · facts-only fold).
# The ONE definition (YAML-SUPERVISORS-RUNTIME): the trigger registry reads wake: from here (graphs/triggers/<registered_as>.yaml is only the tick shim) and goal.yaml is GENERATED from this file (eln loop agent gen) — only the fallback when this file is refused.
apiVersion: elanous/loop-agent@3
manifest:
  name: macrophage
  version: 1.0.0
  description: "2시간 넘은 고아 시험 우주 0 (수호자 reaper 계획 기준)"
  requires:
    executor: loop-agent@3
    kits: [kpi]
    node_kinds: [macrophage.observe, loop-agent.act, loop-agent.learn, loop-agent.judge, loop-agent.finish, gate, reflect, plan, learn-knowhow, retro]
    facts: []
  provides:
    agent: macrophage
    kpis: [orphans_over_2h]
    nodes: [macrophage.observe]   # tier ② — src/loop-agent/bodies/macrophage.ts (+ its tests · sim world supervisors)
identity:
  id: macrophage
  address: MACROPHAGE
  rank: supervisor
  soul: soul.md
supervisor:
  duty: resource-supervision
# v2 card fields that live only here — graphs/loop-agents/macrophage/goal.yaml is GENERATED from this file (eln loop agent gen macrophage)
card:
  name: 대식세포
  role: &purpose 수호자 reaper 로 본부 호스트의 고아 시험 우주를 정확 PID 로 거둔다 — 몸은 수호자 것 하나, 이 카드는 KPI·목소리·L0
  temperament: &voice 조용하고 꼼꼼하다 · 치우기 전에 한 번 더 본다 · PID·라벨·경로로 말한다
  values: &values
    - 정확한 PID 만 — 패턴 kill 은 0
    - 치운 것마다 되돌림 줄을 남긴다
    - 관측 실패는 0 이 아니라 모름 — 모르면 치우지 않는다
  subject: 본부 호스트 고아 — 수호자 reaper 계획(planReap)이 고르는 것 = 등록 TTL 지난 시험 우주 묶음 ⊕ 등록 없이 2시간 넘은 시험 우주 고아(ppid 1)
  actions:
    - reap
  wake_events:
    - 수호자 순찰 한 번 끝남 (guardian last-tick)
    - 하루 1회 04:17
  voice_role: coordinator
  fallback_seat: RES
goal: "2시간 넘은 고아 시험 우주 0 (수호자 reaper 계획 기준)"
policies:   # tier ① — the only numbers (the body reads them through pv() · change behaviour here, not in code)
  orphans_over_2h_max: 0
  max_per_tick: 3
  cooldown_min: 30
  escalate_after_min: 120
  heartbeat_every_min: 1440
  subject_lost_ticks: 3   # unreadable subject this many ticks → reattach proposal to the L0
  stale_worktree_days: 14   # 이보다 오래된 깨끗한 worktree = 보고 줄(정리는 수호자 정비 창) · OPS-RULES «가지·작업 트리 14일 정리»
  stale_stash_days: 14   # 이보다 오래된 stash = 보고 줄(drop 안 함)
  oneshot_grace_h: 24   # 일회성 launchd·날짜 고정 크론은 예정 시각 + 이 시간이 지나면 «지난 것»
  recent_reap_min: 30   # 이 안에 거둔 대상(누구든) = 다시 안 거둠
  # v3 smartness (LOOP-AGENT-V3-SMART-2 · src/loop-agent/v3/smart.ts) — reflect · plan · learn-knowhow · retro read only these
  act_grace_min: 0   # an action's outcome is known when it returns (acted | failed) — no waiting
  lesson_repeat_min: 3   # the same action failing 3× in a row on one kind of subject → ONE lesson with the cause
  reflect_window_min: 60
  lesson_cap: 12   # active lessons kept (oldest evicted)
  knowhow_promote_min: 1   # the lesson becomes one knowhow line at once (marker-deduped · plan reads it next tick)
  knowhow_cap: 5   # learned knowhow lines per agent, total
  plan_ambiguity_margin: 0   # the shell plan is deterministic (body plan ⊕ knowhow ⊕ fallback)
  unacted_penalty: 0.25
  plan_llm_per_hour: 0
  retro_every_h: 6   # retro (회고): journal ⊕ KPI window → what worked · what failed and why · one change to try
  cost_act: 0
kpis:
  - { name: orphans_over_2h, at_most: $policies.orphans_over_2h_max, unit: "procs" }
done_when:
  - "orphans_over_2h == 0 한 틱"
  - "같은 대상에 거두기 1회(수호자 감사 공유)"
  - "치운 행동마다 cases 에 undo 줄"
never_auto: &never
  - "패턴 kill (pkill · killall)"
  - "상주 launchd 서비스(KeepAlive · RunAtLoad · 주기 job) 내리기"
  - "더러운 worktree 또는 가지 삭제"
  - "stash drop"
  - "crontab 편집 (지난 줄은 보고만 → RES)"
  - "원격 호스트 프로세스 (수호자 reaper 몫)"
soul:   # 영혼 (LOOP-AGENT-V3-SMART-2 · lint requires it) — plan and voice load it · aliases = one definition with the card
  purpose: *purpose
  values: *values
  do_not: *never
  voice: *voice
  serves:
    - "RES (L0 · resource-supervision)"
    - "호스트를 나눠 쓰는 손 자리"
wake:
  registered_as: macrophage-agent
  owner: OP   # the registry's exception card (no tick) goes to OP, not the dormant RES seat (as before this file was the source)
  trigger:
    condition:
      predicate: {"kind":"state-changed","parts":[{"file":"{stateRoot}/loop-agents/guardian/state.json"}]}
      cooldown_min: 30
      max_wait_min: 1440
      on_max_wait: fire
  failure: { goal_deadline_min: 60, max_attempts: 2, backoff_sec: [60] }   # the registry's goal deadline · attempts · backoff (was graphs/triggers/macrophage-agent.yaml)
body:   # tier ① routing — observe outcome → steps (ok · breach · unknown → act; off · error → finish)
  entry_node: observe
  terminal_nodes: [done]
  nodes:
    - { node_id: observe, kind: macrophage.observe, max_visits: 1 }
    - { node_id: act, kind: loop-agent.act, max_visits: 1 }
    - { node_id: learn, kind: loop-agent.learn, max_visits: 1 }
    - { node_id: judge, kind: loop-agent.judge, max_visits: 1 }
    - { node_id: finish, kind: loop-agent.finish, max_visits: 1 }
    - { node_id: done, kind: gate }
    - { node_id: reflect, kind: reflect, optional: true }        # v3: did my actions work? same failure N× → a pattern with its cause
    - { node_id: plan, kind: plan, optional: true }              # v3: the body plan ⊕ learned knowhow → fallback · soul do_not · cited memory
    - { node_id: learn-knowhow, kind: learn-knowhow, optional: true } # v3: one lesson → one knowhow line
    - { node_id: retro, kind: retro, optional: true }            # v3: every retro_every_h → retro entry in memory (the voice quotes it)
  edges:
    - { from: observe, on: outcome, map: { ok: act, breach: act, unknown: act, off: finish, error: finish } }
    - { from: act, on: outcome, map: { ok: learn } }
    - { from: learn, on: outcome, map: { ok: judge } }
    - { from: judge, on: outcome, map: { ok: finish } }
    - { from: finish, on: outcome, map: { ok: done } }
actions:   # v3 plan (LOOP-AGENT-V3-SMART-2): the card rights as plan choices · fallback = what the plan runs once a knowhow line says the action keeps failing
  - { id: reap, channel: self, target: self, serves: [orphans_over_2h], cost: $policies.cost_act, default: true }
voice:   # tier ③ — one LLM turn only when spoken to (role router · coordinator) · facts-only fold over budget
  channel: loop:macrophage
  speak_on: [kpi-breach, kpi-recovered, subject-lost]
  mail: l0-only
  per_hour_max: 6
memory:
  knowhow: knowhow.md
budget:
  llm_turns_per_hour: 6
levels:
  start: live
  values: [live, L1, shadow, off]
