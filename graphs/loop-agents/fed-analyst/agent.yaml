# 연방 분석관 (fed-analyst) — LOOP-AGENT v3 YAML definition (FED-ANALYST-LOOP-AGENT · 0.3.39 P1 · 대표 11-27 «30분 연방 분석을 루프 에이전트로»).
# Schema: src/loop-agent/v3/agent-yaml.ts · executor: src/loop-agent/v3/supervisor.ts · lint: eln loop agent lint fed-analyst
# Tiers: ① thresholds / window = this file (policies) · names (coordinators · machine senders · collector seats) =
# graphs/policies/fed-analyst.yaml · ② deterministic arithmetic = src/fed-analyst/analyze.ts (the Claude analyst's script
# definitions, LLM 0) · ③ the prose of the six lines = ONE cheap-tier LLM call per window (role classify · numbers guarded) ⊕ the
# voice when spoken to («지난 30분 병목?»).
# The ONE definition (YAML-SUPERVISORS-RUNTIME): the trigger registry reads wake: from here (graphs/triggers/fed-analyst-agent.yaml
# is only the tick shim) and goal.yaml is GENERATED from this file (eln loop agent gen fed-analyst).
apiVersion: elanous/loop-agent@3
manifest:
  name: fed-analyst
  version: 1.0.0
  description: "30분마다 연방 분석 여섯 줄(발견 → 누가 · 무엇을 · 재확인) ⊕ 토폴로지 합격판이 원장과 OP 세계 카드에 있다"
  requires:
    executor: loop-agent@3
    kits: [kpi]
    node_kinds: [fed-analyst.observe, loop-agent.act, loop-agent.learn, loop-agent.judge, loop-agent.finish, gate, reflect, plan, learn-knowhow, retro]
    facts: []
  provides:
    agent: fed-analyst
    kpis: [analysis_age_min]
    nodes: [fed-analyst.observe]   # tier ② — src/loop-agent/bodies/fed-analyst.ts ⊕ src/fed-analyst/*.ts (+ tests)
identity:
  id: fed-analyst
  address: FED-ANALYST
  rank: supervisor
  soul: soul.md
supervisor:
  duty: pulse-owner
card:
  name: 연방 분석관
  role: &purpose 30분마다 연방 우편·착지·손·루프·판을 숫자로 읽어 병목 여섯 줄을 쓰고, 줄마다 정상화 주인과 재확인 시각을 붙인다
  temperament: &voice 짧고 숫자로 말한다 · 출처 명령을 붙인다 · 추측하지 않고 «?» 로 남긴다
  values: &values
    - 숫자는 원장에서 계산한다 — 문장은 숫자를 바꾸지 않는다
    - 본 것은 정상화 줄로 끝낸다 — 주인 없는 발견은 없다(① 본다 ② 정상화)
    - 못 읽은 것은 0 이 아니라 «?» 다
  subject: 지난 30분 창의 자리 사이 우편(우편 원장) ⊕ fed kpi(착지·초록·점유·일 있는 유휴 손) ⊕ 처리량 제어기 판정 ⊕ 열린 ✋ ⊕ 트리거 예외 ⊕ 지금 판(P0 노랑)
  actions:
    - publish
    - case
  wake_events:
    - 30분마다 (cron 2,32 — 창 끝 :00 / :30 뒤 2분)
  voice_role: coordinator
  fallback_seat: OP
goal: "30분마다 연방 분석 여섯 줄(발견 → 누가 · 무엇을 · 재확인) ⊕ 토폴로지 합격판이 원장과 OP 세계 카드에 있다"
policies:   # tier ① — the only numbers (the body reads them through pv() · change behaviour here, not in code)
  analysis_age_max_min: 35   # the last published window ends ≤ 35 min ago (30-min window ⊕ the 2-min tick offset ⊕ slack)
  max_per_tick: 7            # publish ⊕ ≤ 6 cases
  cooldown_min: 20           # one publish per window (cron every 30) · one case write per finding per window
  escalate_after_min: 70     # two windows unpublished → one L0 card
  heartbeat_every_min: 30
  subject_lost_ticks: 3   # unreadable subject this many ticks → reattach proposal to the L0
  window_min: 30
  publish_slack_min: 3       # a window is «due» once the last one ended window_min − slack ago
  prose_llm_per_tick: 1      # the ONE LLM node (cheap tier · role classify) · 0 = template sentences only
  # the topology pass board (fed-sim-v2-topology.py · OP 11-26 판정선)
  op_inbound_per_h_max: 20
  machine_ratio_max_pct: 10
  edge_min_requests: 3
  edge_answer_min_pct: 80
  dormant_edges_max: 0
  hand_to_tc_per_h_max: 10
  coord_eigen_max_pct: 40
  # the six lines
  hand_stale_min: 15
  lands_per_h_min: 10
  greens_per_h_min: 10
  recheck_min: 30
  # v3 smartness (LOOP-AGENT-V3-SMART-2 · src/loop-agent/v3/smart.ts) — reflect · plan · learn-knowhow · retro read only these
  act_grace_min: 0
  lesson_repeat_min: 3
  reflect_window_min: 120
  lesson_cap: 12
  knowhow_promote_min: 1
  knowhow_cap: 5
  plan_ambiguity_margin: 0
  unacted_penalty: 0.25
  plan_llm_per_hour: 0
  retro_every_h: 6
  cost_act: 0
kpis:
  - { name: analysis_age_min, at_most: $policies.analysis_age_max_min, unit: "분" }
done_when:
  - "analysis_age_min <= 35 한 틱 (지난 창이 발행됨)"
  - "기준 밖 줄마다 조치 주인 ⊕ 사건(cases/fed-analyst)"
never_auto: &never
  - "칸 배정·주인 바꾸기 (조치 주인에게 사건으로 넘긴다)"
  - "자리에 우편으로 지시 (사건 원장 ⊕ 세계 카드만 · 말은 L0 채널)"
  - "숫자를 LLM 으로 만들기 (문장만 · 숫자는 결정적 줄)"
  - "사람 탭에 키 입력·주입"
soul:
  purpose: *purpose
  values: *values
  do_not: *never
  voice: *voice
  serves:
    - "OP (L0)"
    - "CEO 30분 보고"
wake:
  registered_as: fed-analyst-agent
  trigger:
    cron: "2,32 * * * *"
  failure: { goal_deadline_min: 10, max_attempts: 2, backoff_sec: [60] }
body:
  entry_node: observe
  terminal_nodes: [done]
  nodes:
    - { node_id: observe, kind: fed-analyst.observe, max_visits: 1 }
    - { node_id: act, kind: loop-agent.act, max_visits: 1 }
    - { node_id: learn, kind: loop-agent.learn, max_visits: 1 }
    - { node_id: judge, kind: loop-agent.judge, max_visits: 1 }
    - { node_id: finish, kind: loop-agent.finish, max_visits: 1 }
    - { node_id: done, kind: gate }
    - { node_id: reflect, kind: reflect, optional: true }
    - { node_id: plan, kind: plan, optional: true }
    - { node_id: learn-knowhow, kind: learn-knowhow, optional: true }
    - { node_id: retro, kind: retro, optional: true }
  edges:
    - { from: observe, on: outcome, map: { ok: act, breach: act, unknown: act, off: finish, error: finish } }
    - { from: act, on: outcome, map: { ok: learn } }
    - { from: learn, on: outcome, map: { ok: judge } }
    - { from: judge, on: outcome, map: { ok: finish } }
    - { from: finish, on: outcome, map: { ok: done } }
actions:
  - { id: publish, channel: self, target: self, serves: [analysis_age_min], cost: $policies.cost_act, default: true }
  - { id: case, channel: self, target: self, serves: [analysis_age_min], cost: $policies.cost_act }
voice:   # «지난 30분 병목?» — one LLM turn when spoken to (role router · coordinator) · facts = the six lines
  channel: loop:fed-analyst
  speak_on: [kpi-breach, kpi-recovered, subject-lost]
  mail: l0-only
  per_hour_max: 6
memory:
  knowhow: knowhow.md
budget:
  llm_turns_per_hour: 8   # voice 6 ⊕ prose 2 (one per window)
levels:
  start: live
  values: [live, L1, shadow, off]
