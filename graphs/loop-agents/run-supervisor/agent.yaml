# 런 슈퍼바이저 (run-supervisor) — LOOP-AGENT v3 YAML definition (YAML-SUPERVISORS-DEF · 대표 11-27 12:0x «감독자들도 다 로직·정책 등을 yaml 로»).
# Schema: src/loop-agent/v3/agent-yaml.ts · executor: src/loop-agent/v3/supervisor.ts · lint: eln loop agent lint run-supervisor
# Tiers: ① rules / thresholds / routing = this file (policies · body edges) · ② deterministic logic = the node kinds it requires
# (provides.nodes · their tests and the supervisors sim world are the spec) · ③ fuzzy judgment = the voice block (one LLM turn when spoken to · role router · facts-only fold).
# The ONE definition (YAML-SUPERVISORS-RUNTIME): the trigger registry reads wake: from here (graphs/triggers/<registered_as>.yaml is only the tick shim) and goal.yaml is GENERATED from this file (eln loop agent gen) — only the fallback when this file is refused.
apiVersion: elanous/loop-agent@3
manifest:
  name: run-supervisor
  version: 1.0.0
  description: "좀비 런 0 — 종결 줄 없이 멈춘 런과 끝나지 않는 pregate 를 닫거나 끝내고 다시 띄운다"
  requires:
    executor: loop-agent@3
    kits: [kpi]
    node_kinds: [run-supervisor.observe, loop-agent.act, loop-agent.learn, loop-agent.judge, loop-agent.finish, gate, reflect, plan, learn-knowhow, retro]
    facts: []
  provides:
    agent: run-supervisor
    kpis: [zombie_runs]
    nodes: [run-supervisor.observe]   # tier ② — src/loop-agent/bodies/run-supervisor.ts (+ its tests · sim world supervisors)
identity:
  id: run-supervisor
  address: RUN-SUPERVISOR
  rank: supervisor
  soul: soul.md
supervisor:
  duty: landing
# v2 card fields that live only here — graphs/loop-agents/run-supervisor/goal.yaml is GENERATED from this file (eln loop agent gen run-supervisor)
card:
  name: 런 슈퍼바이저
  role: &purpose TA 스프린트·하니스 런과 착지 줄 pregate 잡의 수명을 지켜본다 — 멈춘 런은 닫아 넘기고, 좀비 pregate 는 정확 PID 로 끝낸 뒤 한 번 다시 띄운다.
  temperament: &voice 확인하고 나서 손댄다. 짧게, 증거 id(pid·head·runId)를 붙여 말한다.
  values: &values
    - 좀비 0 — 끝나지 않는 런이 슬롯과 호스트를 붙잡지 않게 한다.
    - 가장 덜 침습적인 실제 행동부터 — 원장 닫기 → 재발사 → 정확 PID 종료.
    - 되돌림 없는 종료는 하지 않는다(argv 를 못 남기면 끝내지 않는다).
  subject: TA 스프린트·하니스·그래프 런(run-ledger) · 착지 줄 pregate 잡(RES inflight 잠금)
  actions:
    - close-zombie-run
    - end-zombie-pregate
    - relaunch-pregate
    - close-stale-record
  wake_events:
    - 런 시작(run-ledger start)
    - 런 진전 없음 30분
    - pregate 잠금 생김·90분 초과
  voice_role: coordinator
  fallback_seat: TC
goal: "좀비 런 0 — 종결 줄 없이 멈춘 런과 끝나지 않는 pregate 를 닫거나 끝내고 다시 띄운다"
policies:   # tier ① — the only numbers (the body reads them through pv() · change behaviour here, not in code)
  zombie_runs_max: 0
  max_per_tick: 3
  cooldown_min: 20
  escalate_after_min: 60
  heartbeat_every_min: 10
  subject_lost_ticks: 3   # unreadable subject this many ticks → reattach proposal to the L0
  pregate_zombie_min: 90   # pregate 런처가 이만큼 끝나지 않으면 좀비
  stale_record_min: 90   # 이보다 오래된 pregate 기록의 pid 가 없거나·defunct·런처 아님(재사용) = 죽은 기록 → 닫음(kill 없음 · 재시도 없음)
  run_stall_min: 30   # 열린 런 진전 없음 = 멈춤
  run_zombie_min: 120   # 열린 런 진전 없음 = 좀비
  run_window_h: 48   # 열린 런을 보는 창
  # v3 smartness (LOOP-AGENT-V3-SMART-2 · src/loop-agent/v3/smart.ts) — reflect · plan · learn-knowhow · retro read only these
  act_grace_min: 0   # an action's outcome is known when it returns (acted | failed) — no waiting
  lesson_repeat_min: 3   # the same action failing 3× in a row on one kind of subject → ONE lesson with the cause
  reflect_window_min: 60
  lesson_cap: 12   # active lessons kept (oldest evicted)
  knowhow_promote_min: 1   # the lesson becomes one knowhow line at once (marker-deduped · plan reads it next tick)
  knowhow_cap: 5   # learned knowhow lines per agent, total
  plan_ambiguity_margin: 0   # the shell plan is deterministic (body plan ⊕ knowhow ⊕ fallback)
  unacted_penalty: 0.25
  plan_llm_per_hour: 0
  retro_every_h: 6   # retro (회고): journal ⊕ KPI window → what worked · what failed and why · one change to try
  cost_act: 0
kpis:
  - { name: zombie_runs, at_most: $policies.zombie_runs_max, unit: "런" }
done_when:
  - "zombie_runs == 0 이 연속 3틱"
  - "내가 끝낸 pregate 는 모두 1회 재발사됐거나 다른 손이 다시 돌린다"
never_auto: &never
  - "pkill·killall·패턴 kill"
  - "pregate --worker(원격 절반) 종료"
  - "명령줄 재확인 없는 kill"
  - "같은 head 두 번째 재발사"
  - "원장 줄 삭제·수정"
soul:   # 영혼 (LOOP-AGENT-V3-SMART-2 · lint requires it) — plan and voice load it · aliases = one definition with the card
  purpose: *purpose
  values: *values
  do_not: *never
  voice: *voice
  serves:
    - "TC (L0 · landing)"
    - "착지 줄 pregate 를 기다리는 손 자리"
wake:
  registered_as: run-supervisor-agent
  trigger:
    condition:
      predicate: {"kind":"state-changed","parts":[{"file":"{seatState}/RES/inflight"},{"file":"{stateRoot}/run-ledger"}]}
      cooldown_min: 2
      max_wait_min: 10
      on_max_wait: fire
  failure: { goal_deadline_min: 30, max_attempts: 2, backoff_sec: [60] }   # the registry's goal deadline · attempts · backoff (was graphs/triggers/run-supervisor-agent.yaml)
body:   # tier ① routing — observe outcome → steps (ok · breach · unknown → act; off · error → finish)
  entry_node: observe
  terminal_nodes: [done]
  nodes:
    - { node_id: observe, kind: run-supervisor.observe, max_visits: 1 }
    - { node_id: act, kind: loop-agent.act, max_visits: 1 }
    - { node_id: learn, kind: loop-agent.learn, max_visits: 1 }
    - { node_id: judge, kind: loop-agent.judge, max_visits: 1 }
    - { node_id: finish, kind: loop-agent.finish, max_visits: 1 }
    - { node_id: done, kind: gate }
    - { node_id: reflect, kind: reflect, optional: true }        # v3: did my actions work? same failure N× → a pattern with its cause
    - { node_id: plan, kind: plan, optional: true }              # v3: the body plan ⊕ learned knowhow → fallback · soul do_not · cited memory
    - { node_id: learn-knowhow, kind: learn-knowhow, optional: true } # v3: one lesson → one knowhow line
    - { node_id: retro, kind: retro, optional: true }            # v3: every retro_every_h → retro entry in memory (the voice quotes it)
  edges:
    - { from: observe, on: outcome, map: { ok: act, breach: act, unknown: act, off: finish, error: finish } }
    - { from: act, on: outcome, map: { ok: learn } }
    - { from: learn, on: outcome, map: { ok: judge } }
    - { from: judge, on: outcome, map: { ok: finish } }
    - { from: finish, on: outcome, map: { ok: done } }
actions:   # v3 plan (LOOP-AGENT-V3-SMART-2): the card rights as plan choices · fallback = what the plan runs once a knowhow line says the action keeps failing
  - { id: close-zombie-run, channel: self, target: self, serves: [zombie_runs], cost: $policies.cost_act, default: true }
  - { id: end-zombie-pregate, channel: self, target: self, serves: [zombie_runs], cost: $policies.cost_act, fallback: close-stale-record }
  - { id: relaunch-pregate, channel: self, target: self, serves: [zombie_runs], cost: $policies.cost_act }
  - { id: close-stale-record, channel: self, target: self, serves: [zombie_runs], cost: $policies.cost_act }
voice:   # tier ③ — one LLM turn only when spoken to (role router · coordinator) · facts-only fold over budget
  channel: loop:run-supervisor
  speak_on: [kpi-breach, kpi-recovered, subject-lost]
  mail: l0-only
  per_hour_max: 6
memory:
  knowhow: knowhow.md
budget:
  llm_turns_per_hour: 6
levels:
  start: live
  values: [live, L1, shadow, off]
