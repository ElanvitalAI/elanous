    kind: agent
    recipe: 'cmd:recover-plan'
    max_visits: 1
    contract: { inputs: [ask, context, prior], tools: read-only, outputs: [result, evidence] }
  - node_id: request-review
    kind: agent
    recipe: 'cmd:recover-plan'
    max_visits: 1
    contract: { inputs: [ask, context, prior], tools: read-only, outputs: [result, evidence] }
