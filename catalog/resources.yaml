      isTtsProviderUsableNow() per candidate and walks down on its own.
      MEASURED in a zero-credential rig (HOME isolated, 45 credential env vars unset):
        no credential + no explicit choice  →  chosen = ***edge-tts***  (was openai-tts)
        explicit STT/TTS env or config      →  that id is RESPECTED, even unusable
