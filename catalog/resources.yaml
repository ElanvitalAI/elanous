    free_fallback_mode: auto
    free_fallback: >-
      MEASURED 2026-09-22 — the degradation is AUTOMATIC, not a documented intent.
      Chain: bootDefaultOcrProviders() (src/ocr/index.ts:86) registers Upstage +
      LLMVision + Tesseract unconditionally, and production calls it at daemon boot
      (src/nexus/index.ts:1996). OcrRegistry.pick() skips any provider whose
      isAvailable() is false, and UpstageProvider.isAvailable() is
      `resolveApiKey() !== null` (src/ocr/upstage.ts:331) — so with no key Upstage
      drops out of the ranking and Tesseract (credential-free) wins.
      Tesseract itself reads no key; it only needs tesseract.js installed.

