# External resource map — v0
#
# ⛔ Every field here was MEASURED on 2026-09-20, not assumed. Fields that
#    could not be measured are ABSENT rather than guessed: an absent
#    `free_fallback` means "not measured", never "there is none".
#
# Why this file exists: elanous reads 33 credentials from FOUR different
# places, two of them silently. Without a map, a new user cannot tell
# what is required, what is optional, or what already has a free path.
#
# How it was built (re-run these to check it has not gone stale):
#   env sweep      rg -o "process\.env\.[A-Z_0-9]+" src/ scripts/ --glob '!*.test.ts'
#                  ⛔ THAT SWEEP ALONE IS NOT ENOUGH — measured 2026-09-21, it misses TWO idioms
#                  and the misses are silent (a name simply never appears):
#                    ⓐ injected env — this repo passes `env: NodeJS.ProcessEnv` for testability,
#                      so credentials are read as `env.NAME`, not `process.env.NAME`.
#                      Five names were invisible this way, three of them in ONE file
#                      (src/expression/config/env-bridge.ts — the env→config bridge itself).
#                    ⓑ string literals — e.g. `envKey: 'GROK_API_KEY'` in a table.
#                  ⇒ also run:
#                    rg -o "env\.[A-Z][A-Z0-9_]{2,}" src/ scripts/ --glob '!*.test.ts'
#                    rg -o "'[A-Z][A-Z0-9_]{2,}(_KEY|_TOKEN|_SECRET)'" src/ scripts/ --glob '!*.test.ts'
#   resolution     elanous doctor            # which of the four sources answers
#   coverage       every `env:` name below must appear in .env.example
#
# Schema (RFC §2ⓒ):
#   id            what you obtain from a vendor — ONE per account, not per env name
#   kind          llm | crawl | voice | media | finance | messenger | dev | internal
#   tier          free | paid | subscription | byo
#   auth          api-key | oauth-browser | cli-login | none
#   env           every name the code accepts for this ONE credential
#   required_for  what stops working without it (measured from read sites)
#   free_fallback ⭐ the point of this file — a path that needs no key
#   reads         the source location that proves `required_for`

meta:
  measured_at: 2026-09-21
  credential_count: 41          # env names in src/ + scripts/, excluding config/URL/flag names
  account_count: 30             # after folding alias chains (see `env:` lists below)
  sources:                      # where a credential can come from, in resolution order
    - env
    - "~/.cache/<lowercased-name>"      # src/config.ts:106 — read SILENTLY
    - "~/.claude/skills/<skill>/.env"   # src/web-search/tavily.ts:30 — outside this repo
    - "elanous user config (~/.elanous)"    # src/registry/discovery/config.ts:44
  note: >-
    A fresh install has none of the four. `elanous doctor` names which one
    answered for each credential.

resources:
  # ── LLM ────────────────────────────────────────────────────────────
  # The primary path is a subscription, not an API key. `elanous login
  # openai-codex` uses the ChatGPT device-code flow. Five providers are
  # additionally described in catalog/providers/*.yaml (apiKeyEnv).
  - id: anthropic
    kind: llm
    tier: byo
    auth: api-key
    env: [ANTHROPIC_API_KEY]
    required_for: [anthropic-llm]
    free_fallback: "subscription via `elanous login`; llm.fallbackChain"
    reads: catalog/providers/anthropic.yaml
    free_fallback_mode: auto
    free_fallback_note: >-
      MEASURED 2026-09-23 — losing this key costs only its OWN `<provider>-llm`
      capability; general LLM work is covered automatically by `llm.fallbackChain`.
      No human action is needed, so the mode is `auto`, not `manual`.

  - id: openai
    kind: llm
    tier: subscription
    auth: oauth-browser
    env: [OPENAI_API_KEY]
    required_for: [openai-llm]
    free_fallback: "`elanous login openai-codex` (device code, no API key)"
    reads: catalog/providers/openai.yaml
    free_fallback_mode: none
    boundary_note: >-
      ⭐⭐ THIS IS THE FLOOR. The other LLM rows degrade into `llm.fallbackChain`;
      these two ARE that chain (code default `['codex-rotate']`, this instance `['grok']`
      as of 2026-09-23). Nothing in-tree sits below them, so elanous cannot do LLM work
      with zero LLM credentials. That is a PROPERTY OF THE PRODUCT, not a gap in the map.
      ⇒ The open-core question here is not `auto|manual|none` but the owner's: is a BYO
      subscription part of CORE (like bringing a database) or is it an add-on?

