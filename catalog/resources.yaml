  #   🩸 그래서 epidemic 줄의 옛 주석 "no reader here" 가 «거짓»이 됐다 — 소비자는 MCP 서버였다.
  #   ⇒ 🅣 가 그 거짓을 찾았고(2026-09-22), 기전은 「정의역 밖을 «없다»로 접은 것」이다.
  # ⚠️ free_fallback_mode 는 capabilities.ts 의 free 구현으로 판정했다 — 그쪽이 능력 축의 canonical 이다.

  - id: topview
