    boundary: core
    boundary_note: >-
      Owner DECISION 2026-09-23 — core despite needing a token. The mechanical rule
      (`auth: none` or `free_fallback_mode: auto`) would file this as an add-on, but
      the decision is that a FREE account/token is part of the core surface. The rule
