      ⇒ the mechanism became automatic, so the boundary verdict moves add-on → CORE.
    free_fallback: >-
      Two credential-free TTS providers ship in-tree and both are implemented:
      `edge-tts` (no API key, multilingual incl. Korean, cross-platform) and
      `macos-say` (tier: 'free' in the registry, macOS only).
      With no TTS key or explicit config or TTS_PROVIDER selection, the daemon
      automatically picks an installed free provider (`edge-tts` with `sox`, then
      macOS `say`) if available. Otherwise it retains the original choice;
      explicit provider choices remain respected.

