  - id: aws-s3
    kind: media
    tier: paid
    auth: api-key
    env: [AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY]   # TWO names, ONE account
    required_for: [s3-public-derived-asset-upload]
    reads: src/webclone/webclone-store.ts:180
    # Both keys gate only public S3 upload of derived assets; captured assets
    # are rejected before credentials are checked (uploadAsset()).
    free_fallback_mode: none
    free_fallback: >-
      None. src/webclone/webclone-store.ts IS the S3 public-bucket store
      (Bun.s3, which per the file header does NOT read ~/.aws/credentials — env or
      explicit options only). Publishing a public derived asset needs a bucket;
      nothing in-tree substitutes.

