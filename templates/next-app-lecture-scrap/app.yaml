apiVersion: elanous.app/v0
slug: lecture-scrap
title: 강의 노트 · 스크랩
template: next-app-lecture-scrap

frontend:
  kind: static-export
  out: out/

design:
  description: 날짜별 강의 기록과 논리 폴더 예시를 보고 노트 화면과 전체 검색 화면을 둘러본다 (정적 데모)
  screens:
    - { path: /, title: 날짜별 기록 }
    - { path: /notes/new, title: 노트 작성 }
    - { path: /search, title: 검색 }

tables:
  scraps:
    columns:
      id: { type: text, primary: true }
      title: { type: text }
      url: { type: text }
      excerpt: { type: text }
      image_key: { type: text }
      created_at: { type: timestamp, default: now }
    realtime: true
  lecture_notes:
    columns:
      id: { type: text, primary: true }
      title: { type: text }
      body: { type: text }
      created_at: { type: timestamp, default: now }
    realtime: true

roles:
  owner: { via: nexus-session }
  public: { via: public-read }

rpc:
  addScrap:
    sql: INSERT OR IGNORE INTO scraps (id, title, url, excerpt, image_key, created_at) VALUES (:id, :title, :url, :excerpt, :image_key, :created_at)
    params:
      id: { type: text }
      title: { type: text }
      url: { type: text }
      excerpt: { type: text }
      image_key: { type: text }
      created_at: { type: timestamp }
    allow: [owner]
  listScraps:
    sql: SELECT id, title, url, excerpt, image_key, created_at FROM scraps ORDER BY created_at DESC LIMIT :limit
    params:
      limit: { type: int, max: 200, default: 50 }
    allow: [owner, public]
  addLectureNote:
    sql: INSERT INTO lecture_notes (id, title, body, created_at) VALUES (:id, :title, :body, :created_at)
    params:
      id: { type: text }
      title: { type: text }
      body: { type: text }
      created_at: { type: timestamp }
    allow: [owner]
  listLectureNotes:
    sql: SELECT id, title, body, created_at FROM lecture_notes WHERE :beforeCreatedAt = '' OR created_at < :beforeCreatedAt OR (created_at = :beforeCreatedAt AND id < :beforeId) ORDER BY created_at DESC, id DESC LIMIT :limit
    params:
      limit: { type: int, max: 50, default: 20 }
      beforeCreatedAt: { type: text, default: '' }
      beforeId: { type: text, default: '' }
    allow: [owner]
  searchLibrary:
    sql: SELECT id, title, excerpt FROM scraps WHERE title LIKE :query OR excerpt LIKE :query UNION ALL SELECT id, title, body AS excerpt FROM lecture_notes WHERE title LIKE :query OR body LIKE :query LIMIT :limit
    params:
      query: { type: text }
      limit: { type: int, max: 200, default: 50 }
    allow: [owner, public]

storage:
  prefix: apps/lecture-scrap/
  quotaBytes: 104857600
  upload:
    allow: [owner]
    types: [image/jpeg, image/png, image/webp, audio/mp4, audio/m4a, audio/wav]
    maxBytes: 10485760

actions:
  extract:
    builtin: extract
    input: { url: text }
    output: { url: text, title: text, excerpt: text, content: text, provider: text }
    uses: []
  transcribe:
    builtin: stt
    input: { audio: object-ref }
    output: { text: text }
    uses: [cred:openai.api_key]
