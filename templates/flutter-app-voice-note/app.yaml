apiVersion: elanous.app/v0
slug: voice-note
title: 나만의 음성 노트
template: flutter-app-voice-note

frontend:
  kind: static-export
  out: out/

storage:
  prefix: apps/voice-note/
  upload:
    allow: [owner]
    types: [audio/wav, image/jpeg, image/png, image/webp, video/mp4, video/quicktime]
    maxBytes: 10485760

roles:
  owner: { via: nexus-session }
