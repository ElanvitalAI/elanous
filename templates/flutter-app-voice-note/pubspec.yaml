name: flutter_app_voice_note
description: Elanous voice-note app template with recording, media timeline, and member scraps.
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: '>=3.47.0'
dependencies:
  flutter:
    sdk: flutter
  elanous_nexus:
    path: ../../sdk/dart/elanous_nexus
  flutter_secure_storage: ^10.3.4
  flutter_web_auth_2: ^5.1.0
  http: ^1.2.2
  image_picker: ^1.2.0
  path_provider: ^2.1.6
  record: ^6.2.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
