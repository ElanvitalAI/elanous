name: flutter_app_translator
description: Elanous translator app template with Nexus member login.
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.24.0'
dependencies:
  flutter:
    sdk: flutter
  elanous_nexus:
    path: ../../sdk/dart/elanous_nexus
  flutter_secure_storage: ^10.3.4
  flutter_web_auth_2: ^5.1.0
  http: ^1.2.2
  audioplayers: ^6.8.1
  path_provider: ^2.1.6
  record: ^6.2.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
