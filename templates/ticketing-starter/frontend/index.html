<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Demo Concert Tickets</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">LOCAL TICKETING PREVIEW</p>
      <h1 id="event-title">콘서트 티케팅</h1>
      <p id="event-meta">공연 정보를 불러오는 중</p>
      <p id="sample-note" role="note" hidden></p>
    </header>
    <section aria-labelledby="seat-heading">
      <h2 id="seat-heading">좌석 선택</h2>
      <p>좌석을 고른 뒤 2분 동안 홀드할 수 있습니다. 이 화면의 결제는 합성 데모입니다.</p>
      <div id="seat-grid" class="seat-grid" role="group" aria-label="좌석"></div>
      <div class="actions">
        <button id="hold" type="button">선택 좌석 홀드</button>
        <button id="checkout" type="button" disabled>합성 결제와 티켓 발급</button>
      </div>
    </section>
    <section aria-labelledby="ticket-heading">
      <h2 id="ticket-heading">내 티켓</h2>
      <p id="status" role="status" aria-live="polite">준비 중</p>
      <ul id="tickets"></ul>
    </section>
    <footer>데모 신원과 합성 결제만 사용합니다. 실제 판매·결제·공개 게시가 아닙니다.</footer>
  </main>
</body>
</html>
