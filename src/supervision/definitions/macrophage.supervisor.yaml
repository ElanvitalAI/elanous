# supervisor/v1 — macrophage claims and repairs merge-train incidents (graphs/release/macrophage-subscriber.yaml subscriptions).
apiVersion: elanous.dev/supervisor/v1
kind: supervisor
ref: 'loop:macrophage@1'
role: healer
supervises: [release-loop]
signals:
  - { signal: merge-train.incident, actor: final }
  - { signal: merge-train.verdict, actor: observer }
  - { signal: node-end, actor: observer }
authority: [claim, repair, verify, handoff]
reportsTo: 'loop:coordinator@1'
escalation: { to: 'loop:coordinator@1', silenceAfter: PT10M }
# Retention periods are this definition's declared policy; GRAPH-MEMORY-SCOPES requires one but fixes no value.
memory:
  instance: { read: true, write: true, promote: template-candidate, retention: P7D }
  template: { read: true, write: gated-promotion, promote: none, retention: P90D }
  global: { read: card-bound-only, write: none, promote: none }
  provenance: required
