id: cmo-seat
version: 1.0.0
kind: seat
role: docs/roles/MK.md
graph: graphs/operate-loop.yaml
cadence:
  timezone: Asia/Seoul
  byDefcon:
    - {defcon: 5, everyMinutes: 1440}
    - {defcon: 4, everyMinutes: 720}
    - {defcon: 3, everyMinutes: 240}
    - {defcon: 2, everyMinutes: 60}
    - {defcon: 1, everyMinutes: 15}
posture:
  default: 5
  levels:
    - {defcon: 5, minResolution: L0, maxResolution: L2, budget: &normal {maxTokens: 6000, maxToolCalls: 6, maxCostUsd: 0.4}}
    - {defcon: 4, minResolution: L0, maxResolution: L2, budget: *normal}
    - {defcon: 3, minResolution: L1, maxResolution: L3, budget: &urgent {maxTokens: 12000, maxToolCalls: 12, maxCostUsd: 0.8}}
    - {defcon: 2, minResolution: L1, maxResolution: L3, budget: *urgent}
    - {defcon: 1, minResolution: L1, maxResolution: L3, budget: *urgent}
  raiseOn: [{event: mk-checklist-red-or-request-urgent, afterTicks: 1}]
  lowerOn: [{event: mk-backlog-clear, afterTicks: 2}]
  hysteresis: {minDwellMinutes: 120, clearTicks: 2}
resolution:
  default: L0
  steps:
    - {level: L0, grounding: [], budget: &scan {maxTokens: 1500, maxToolCalls: 2, maxCostUsd: 0.1}}
    - {level: L1, grounding: [{tool: omni-digest, budget: *scan}], budget: *normal}
    - {level: L2, grounding: [{tool: omni-crawl, budget: *normal}], budget: *urgent}
    - {level: L3, grounding: [{tool: social-pulse, budget: *scan}, {tool: aside-repl, budget: *normal}], budget: *urgent}
  raiseOn: {event: campaign-anomaly, afterTicks: 1}
  lowerOn: {event: verified-campaign-outcome, afterTicks: 2}
grounding: [omni-digest, omni-crawl, social-pulse, aside-repl]
memory:
  local: {ledger: seat-loop/MK/YYYY-MM-DD.jsonl, working: loop/cmo-seat/context}
  promotesTo: [self-recall, decisions, checklist]
  retention: {workingDays: 7, ledgerDays: 90}
neighbors:
  - {id: op-seat, exchange: [status, request, decision, blocked], heartbeat: {everyMinutes: 1440, missedTicks: 2}, onAbsent: {action: defer, delegateTo: orchestrator}}
  - {id: ux-seat, exchange: [status, request, blocked], heartbeat: {everyMinutes: 1440, missedTicks: 2}, onAbsent: {action: defer, delegateTo: orchestrator}}
  - {id: tc-seat, exchange: [status, request, blocked], heartbeat: {everyMinutes: 1440, missedTicks: 2}, onAbsent: {action: defer, delegateTo: orchestrator}}
spawn:
  allowed: [harness]
  max: 1
  reap: {afterMinutes: 120, onExit: reconcile}
hitl: {ladder: [self-heal, neighbor, orchestrator, human]}
budget: *urgent
observability:
  category: loop.cmo-seat
  events: [tick, posture-change, resolution-change, grounding, heartbeat, absent, exchange, spawn, reap, promote, hitl]
