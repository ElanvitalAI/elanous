signal: false-ready
owner: RES
diagnose:
  - action: host.load.read
repair:
  - action: host.load.wait
    args: {maxLoad: 50, seconds: 0}
    risk: safe
    rollback: no state changed
verify:
  - action: evidence.read
    args: {path: OPS/tb/evidence/rail-catchup-exit1.log}
escalate: {after: 1, message: operator}
