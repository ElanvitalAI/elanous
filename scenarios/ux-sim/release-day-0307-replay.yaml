proposal:
  type: release.gate.receipt-gap-observed
  nodeId: gate-triage
  matchNodeId: gate
  eventNodeId: event-release-gate-receipt-gap-observed
  planNodeId: event-gate-recheck-plan
  fullRecheckNodeId: event-policy-full-recheck
  appendPlanNodeId: event-policy-append-recheck
  appendRunNodeId: event-policy-append-run
  rationale: A newly observed release event must be proposed as a graph diff and exercised before adoption.
events:
  - id: A1
    type: release.cut.appended
    action: append-repaired-commits
    mechanism: recipe
    recipe: cut-append
    binding: cut-append
    rationale: Landed S1 repair commits belong to the active cut.
    pickShas: [aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa]
  - id: A2
    type: release.resume.blocked
    action: resume-same-run
    mechanism: recipe
    recipe: rla-release-recover
    binding: rla-release-recover
    rationale: Resume the first unfinished node while preserving run identity.
    runId: release-sim-release-day-0307-replay-replay
    pickShas: [dddddddddddddddddddddddddddddddddddddddd]
  - id: A3
    type: release.gate.regression.measured
    action: accept-explicit-regressions
    mechanism: domain-pack
    binding: release-gate:generation-based-expiry
    rationale: Accept only listed measured baseline failures and expire by release generations.
    introduced: [src/a.test.ts > failure A, src/b.test.ts > failure B]
  - id: A4
    type: release.repair.land.requested
    action: land-s1-repair-prs
    mechanism: recipe
    recipe: gate-triage
    binding: gate-triage
    rationale: Express landing is limited to reviewed one-line S1 repairs.
  - id: A5
    type: release.gate.repair-assigned
    action: assign-repair-seats
    mechanism: recipe
    recipe: gate-triage
    binding: gate-triage
    rationale: Attribute failures to source files before assigning a repair seat and ladder step.
  - id: A6
    type: release.export-check.failed
    action: diagnose-export-check
    mechanism: recipe
    recipe: export-check
    binding: export-check
    rationale: Preserve the first error and distinguish OOM from host-specific failure.
  - id: A7
    type: release.gate.independent
    action: run-gate-independent-of-export
    mechanism: edge
    binding: outcome
    rationale: Follow the successful gate route declared by the release graph and keep it independent of export-check.
  # Scenario-only branch-control input for exercising policy routing; these are not historical file/time measurements.
  - id: A8
    type: release.cut.appended
    action: append-radius-recheck
    mechanism: recipe
    recipe: gate-same-run-recheck
    binding: gate-same-run-recheck
    rationale: Recheck the changed-file radius and promote to a full sweep only by declared policy.
    changedFiles: [scripts/release-loop/gate-node.ts]
    pickShas: [cccccccccccccccccccccccccccccccccccccccc]
    dependencyLayerChanged: false
    verdictFilesChanged: true
    closureOpaque: false
    receiptCosts: { partialMs: 3, fullMs: 5, source: simulation-same-ledger }
  - id: A9
    type: release.gate.bisect-mode.selected
    action: choose-bisect-mode
    mechanism: recipe
    recipe: gate-triage
    binding: gate-triage
    rationale: Select the declared bisect mode from repeated measured agreement.
  - id: A10
    type: release.gate.host.selected
    action: select-execution-host
    mechanism: recipe
    recipe: gate
    binding: gate
    rationale: Select an available host from guardian resource evidence.
  - id: A11
    type: release.export-prerequisites.provisioned
    action: provision-export-prerequisites
    mechanism: recipe
    recipe: export-check
    binding: export-check
    rationale: Provision only required inputs and keep their contents out of logs.
  - id: A12
    type: release.cut.tree-synced
    action: sync-cut-tree-and-recipe-sha
    mechanism: recipe
    recipe: cut-append
    binding: cut-append
    rationale: Pin the cut tree and recipe identity as part of append handling.
  - id: A13
    type: release.gate.image-identity-checked
    action: validate-gate-image-identity
    mechanism: recipe
    recipe: gate
    binding: gate
    rationale: Verify the actual gate image identity at node execution.
  - id: A14
    type: release.train.worker-restarted
    action: maintain-train-workers
    mechanism: recipe
    recipe: rla-train-worker-restart
    binding: rla-train-worker-restart
    rationale: Replace workers from train and guardian resource evidence.
  - id: A15
    type: release.publish.approval-requested
    action: approve-publication
    mechanism: hitl
    binding: approve-publish
    rationale: Public publication is the declared human approval boundary.
