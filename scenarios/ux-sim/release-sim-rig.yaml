version: 1
kind: release-graph
id: release-sim-rig-0241
isolation: test
input:
  version: '0.3.1'
  previousVersion: '0.3.0'
cases:
  - id: baseline-full-graph
    mode: baseline
    expect:
      status: done
      mustVisit: [version-release, gate, publish, npm-publish, done]
      mustNotVisit: [failed]
  - id: gate-attribution-incomplete
    fault:
      node: gate
      outcome: fail
      evidence: { summaryFailures: 39, identifiedOccurrences: 78, uniqueFailures: 39, baselineRecheck: true }
    expect:
      status: failed
      mustVisit: [gate, gate-triage, traffic-failed-restore, failed]
      mustNotVisit: [publish, npm-publish]
  - id: gate-three-new-regressions
    fault:
      node: gate
      outcome: fail
      evidence: { introducedFailures: 3, baselineRecheck: true }
    expect:
      status: failed
      mustVisit: [gate, gate-triage, failed]
      mustNotVisit: [publish, npm-publish]
  - id: gate-host-occupied
    fault:
      node: gate
      outcome: error
      evidence: { host: node-b, reservation: occupied, executor: pod }
    expect:
      status: failed
      mustVisit: [gate, gate-triage, failed]
      mustNotVisit: [publish]
  - id: gate-measured-regression-waive
    mode: gate-waive-introduced-regression
    expect:
      status: done
      mustVisit: [gate, known-issues, publish, npm-publish, done]
      mustNotVisit: [gate-triage, failed]
  - id: release-version-skip
    fault:
      node: cutoff
      outcome: fail
      evidence: { previousVersion: '0.2.40', selectedVersion: '0.2.41', sequenceGap: true }
    expect:
      status: failed
      mustVisit: [cutoff, traffic-failed-restore, failed]
      mustNotVisit: [checklist-gate, gate, publish]
  - id: public-export-leak
    fault:
      node: export-check
      outcome: fail
      evidence: { publicArtifactLeak: true, classification: release-blocking }
    expect:
      status: failed
      mustVisit: [export-check, traffic-failed-restore, failed]
      mustNotVisit: [gate, publish]
  - id: cut-tip-moved-after-resume
    mode: cut-tip-moved-after-resume
    expect:
      status: resume-refused
      mustVisit: [version-release]
      mustNotVisit: [cutoff, gate, publish]
  - id: prefetch-cache-miss
    fault:
      node: prefetch
      outcome: error
      evidence: { cacheMiss: true, continueToGate: true }
    expect:
      status: done
      mustVisit: [prefetch, pre-gate-join, gate, publish, npm-publish, done]
      mustNotVisit: [failed]
  - id: prefetch-warning-failure-overlaps-checklist
    mode: baseline
    nodeOutcomes:
      checklist-gate: { outcome: ok, delayMs: 40 }
      prefetch: { outcome: error, delayMs: 60 }
    expect:
      status: done
      mustVisit: [checklist-gate, prefetch, pre-gate-join, gate, publish, done]
      mustNotVisit: [failed]
      overlap: [checklist-gate, prefetch]
  - id: mac-smoke-warning-failure-overlaps-pwa
    mode: baseline
    nodeOutcomes:
      mac-smoke: { outcome: fail, delayMs: 60 }
      pwa: { outcome: ok, delayMs: 40 }
    expect:
      status: done
      mustVisit: [mac-smoke, pwa, pre-prepare-join, prepare, publish, done]
      mustNotVisit: [failed]
      overlap: [mac-smoke, pwa]
  - id: publish-command-fails
    fault:
      node: publish
      outcome: fail
      evidence: { published: false, restoreTraffic: true }
    expect:
      status: failed
      mustVisit: [publish, traffic-failed-restore, failed]
      mustNotVisit: [npm-publish, docs-land]
  - id: pwa-node-times-out
    fault:
      node: pwa
      outcome: timeout
      evidence: { timeoutSeconds: 900, restoreTraffic: true }
    expect:
      status: failed
      mustVisit: [mac-smoke, pwa, pre-prepare-join, traffic-failed-restore, failed]
      mustNotVisit: [prepare, publish]

  - id: owner-waive-malformed-gate-schema
    mode: owner-waive-missing-schema
    expect:
      status: done
      mustVisit: [gate, known-issues, publish, npm-publish, done]
      mustNotVisit: [gate-triage, failed]
  - id: owner-waive-0246-verdict-fixture
    mode: owner-waive-0246-fixture
    expect:
      status: done
      mustVisit: [gate, known-issues, publish, npm-publish, verify, done]
      mustNotVisit: [gate-triage, failed]
  - id: append-receipt-set-absent-and-continuous-radius
    mode: append-receipt-continuity
    expect:
      status: done
      mustVisit: [cut, gate-cut, append-a, resume-a, gate-a, append-b, resume-b, gate-b, publish, done]
      mustNotVisit: [failed]
