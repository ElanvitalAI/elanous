# The production provider observes explicitly connected GCP resources read-only.
# With no connection it records that fact and proposes from requirements only.
apiVersion: elanous.dev/graph/v2
graph:
  id: gcp-architect-expand
  version: 1.0.0
  layer: flow
  purpose: "로컬 압력 관측에서 GCP 설계·사용자 승인·유휴 종료까지"
entry: detect
nodes:
  - id: detect
    type: cloud-resource
    requires: cloud-resource.observe@1
    with: { action: read-existing-local-signals }
  - id: design
    type: cloud-resource
    requires: cloud-resource.design@1
    # The registered design provider reads ticketDesignPath from the immutable graph input.
    with: { action: propose }
  - id: deliverables
    type: cloud-resource
    requires: cloud-resource.architecture-deliverables@1
    with:
      action: run-shared-architecture-deliverables
      graph: plugins/architecture-deliverables/graphs/architecture-deliverables.yaml
      input: "$design.result.architectureSpec"
  - id: approve
    type: hitl
    with: { prompt: "프로젝트·API·IAM·예산·작업 생성으로 비용이 발생할 수 있습니다. 승인합니까?" }
    hitl:
      options:
        - { key: y, exit: approved, default: false }
        - { key: N, exit: declined, default: true }
  - id: connect-first
    type: hitl
    with: { approval: "클라우드 연결 필요 — 연결하면 이 설계로 배포 승인. 지금은 실제 자원·견적이 없으며 배포할 수 없습니다." }
    hitl:
      options:
        - { key: y, exit: acknowledged, default: false }
        - { key: N, exit: deferred, default: true }
  - id: provision
    type: cloud-resource
    requires: cloud-resource.provision@1
    with: { action: create-approved-resources }
  - id: schedule
    type: cloud-resource
    requires: cloud-resource.schedule@1
    with: { action: place-approved-work }
  - id: idle-stop
    type: cloud-resource
    requires: cloud-resource.idle-stop@1
    with: { action: stop-idle-resources }
edges:
  - { from: detect, on: outcome, map: { shortage: design, observed: design, no-connection: design, none: done, unknown: failed, failed: failed } }
  - { from: design, on: outcome, map: { proposed: deliverables, requirements-only: deliverables, observed-design: done, failed: failed } }
  - { from: deliverables, on: outcome, map: { done: approve, connection-needed: connect-first, failed: failed } }
  - { from: connect-first, on: outcome, map: { acknowledged: done, deferred: done } }
  - { from: approve, on: outcome, map: { approved: provision, declined: failed } }
  - { from: provision, on: outcome, map: { done: schedule, failed: failed } }
  - { from: schedule, on: outcome, map: { done: idle-stop, failed: idle-stop } }
  - { from: idle-stop, on: outcome, map: { stopped: done, done: done, failed: failed } }
terminal: [done, failed]
observe: { categories: [graph.run, graph.unit, cloud-resource] }
