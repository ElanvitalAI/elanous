  - { node_id: answers, kind: agent, recipe: 'cmd:answers', max_visits: 1 }
  - { node_id: web, kind: agent, recipe: 'cmd:web', max_visits: 1 }
  - { node_id: score, kind: agent, recipe: 'cmd:score', max_visits: 1 }
  - { node_id: suggest, kind: agent, recipe: 'cmd:suggest', max_visits: 1 }
  - { node_id: report, kind: agent, recipe: 'cmd:report', max_visits: 1 }
  - { node_id: done, kind: gate, max_visits: 1 }
  - { node_id: failed, kind: gate, max_visits: 1 }
edges:
