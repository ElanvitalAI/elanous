  - { from: answers, on: outcome, map: { ok: web, fail: failed } }
  - { from: web, on: outcome, map: { ok: score, fail: failed } }
  - { from: score, on: outcome, map: { ok: suggest, fail: failed } }
  - { from: suggest, on: outcome, map: { ok: report, fail: failed } }
