apiVersion: elanous.dev/graph/v2
graph: { id: absorb-ingest, version: 1.0.0, layer: flow, purpose: "검증된 회원 소유 스크랩을 저장" }
entry: docparse
nodes:
  - id: docparse
    type: capability
    requires: absorb.document-parse@1
    with: { source: "$input" }
  - id: save
    type: store
    requires: store.write@1
    with:
      op: create
      collection: scraps
      owner: "$context.memberId"
      value: "$docparse.result.scrap"
      status: new
      ownerScoped: true
edges:
  - { from: docparse, on: outcome, map: { done: save, failed: failed } }
  - { from: save, on: outcome, map: { done: done, failed: failed } }
terminal: [done, failed]
observe: { categories: [graph.run, absorb.scrap] }
