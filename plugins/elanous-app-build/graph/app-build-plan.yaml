apiVersion: elanous.dev/graph/v2
graph: { id: app-build-plan, version: 1.0.0, layer: flow, purpose: "일반 앱 생성의 검증된 가정·아키텍처·파일 계획" }
entry: assumptions
nodes:
  - id: assumptions
    type: capability
    requires: source-planning.assumptions@1
