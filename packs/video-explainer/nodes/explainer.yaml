kind: explainer
graph: workflow
title: 설명 영상 만들기
description: 사실 목록으로 «N가지 한 번에» 설명 영상(나레이션 ⊕ 낱말 시각 캡션 ⊕ 선화 다이어그램)을 만든다
inputs:
  type: object
  required: [topic, facts]
  properties:
    topic: { type: string, title: 주제 }
    facts: { type: string, title: 사실 목록(한 줄에 하나 · 근거 링크 포함) }
    workdir: { type: string, title: 작업 폴더 }
outputs:
  type: object
  properties:
    video: { type: string }
run:
  skill: { name: explainer-video, prompt: "주제: {{inputs.topic}}\n사실:\n{{inputs.facts}}\n작업 폴더: {{inputs.workdir}}" }
